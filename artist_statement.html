<!DOCTYPE html>
<html>
<head>
    <title>𝒶𝓇𝓉𝒾𝓈𝓉 𝓈𝓉𝒶𝓉𝑒𝓂𝑒𝓃𝓉</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="images/icon.png">

    <style>

        body {
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            color: black;
            background-color: #02010f;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            text-align: center;
            box-sizing: border-box;
        }

        a {
            color: rgb(105, 255, 150);
            text-decoration: none;
        }


        /* BACK BUTTON */

        .back {
            display: inline-block;
            margin-bottom: 30px;
        }


        /* IMAGE + CAPTION */

        .composition {
            min-height: calc(100vh - 120px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }


        /* IMAGE */

        .image-stack {
            width: 30%;
            max-width: 350px;
            margin: 0 auto;
            line-height: 0;
        }

        .image-stack img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }


        /* CAPTION */

        .caption {
            margin-top: 20px;
            text-align: center;
        }


        /* PHONE */

        @media (max-width: 768px) {

            body {
                padding: 10px;
            }

            .back {
                margin-bottom: 20px;
            }

            .composition {
                min-height: calc(100vh - 80px);
            }

            .image-stack {
                width: 80%;
                max-width: none;
            }

            .image-stack img {
                width: 100%;
            }

            .caption {
                margin-top: 15px;
                font-size: 14px;
            }

        }

    </style>
</head>

<body>

    <a class="back" href="food_for_thought.html">╾━╤デ╦︻</a>

    <div class="composition">

        <div class="image-stack">

            <img src="images/IMG_6969.jpg">


</body>
</html>
