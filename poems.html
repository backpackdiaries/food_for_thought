
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>word machine</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
    }

    body {
        background-color: #02010f;
        background-image: url("images/thoughts_1.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        color: fuchsia;
        font-family: "Courier New", monospace;

        overflow: hidden;
    }

    a {
        color: rgb(105, 255, 150);
        text-decoration: none;
    }

    a:hover {
        color: fuchsia;
    }

    .home-button {
        position: absolute;
        top: 15px;
        left: 15px;
        z-index: 10;
    }

    .game {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        width: 90%;
        max-width: 600px;

        text-align: center;
    }

    .thought-bubble {
        position: relative;

        padding: 35px 40px;

        background: rgba(2, 1, 15, 0.84);
        border: 1px solid fuchsia;
        border-radius: 40px;

        font-size: 15px;
        line-height: 1.7;

        min-height: 150px;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* little thought bubbles */

    .thought-bubble::before {
        content: "";
        position: absolute;

        width: 16px;
        height: 16px;

        left: 45px;
        bottom: -25px;

        background: rgba(2, 1, 15, 0.84);
        border: 1px solid fuchsia;
        border-radius: 50%;
    }

    .thought-bubble::after {
        content: "";
        position: absolute;

        width: 7px;
        height: 7px;

        left: 30px;
        bottom: -38px;

        background: rgba(2, 1, 15, 0.84);
        border: 1px solid fuchsia;
        border-radius: 50%;
    }

    #poem {
        white-space: pre-line;
    }

    .word {
        color: rgb(105, 255, 150);
    }

    .input-area {
        margin-top: 45px;
    }

    input {
        width: 220px;

        padding: 8px 10px;

        background: #02010f;
        color: rgb(105, 255, 150);

        border: 1px solid fuchsia;
        border-radius: 4px;

        font-family: "Courier New", monospace;
        font-size: 14px;

        outline: none;
    }

    input:focus {
        color: fuchsia;
    }

    button {
        margin-left: 5px;

        padding: 8px 12px;

        background: #02010f;
        color: rgb(105, 255, 150);

        border: 1px solid fuchsia;
        border-radius: 4px;

        font-family: "Courier New", monospace;
        font-size: 14px;

        cursor: pointer;
    }

    button:hover {
        color: fuchsia;
    }

    .hint {
        margin-top: 15px;
        font-size: 11px;
        opacity: 0.7;
    }

    @media (max-width: 600px) {
        .game {
            width: 92%;
        }

        .thought-bubble {
            padding: 30px 25px;
            font-size: 14px;
        }

        input {
            width: 60%;
        }
    }
</style>
</head>

<body>

<a class="home-button" href="index.html">[ back ]</a>

<div class="game">

    <div class="thought-bubble">
        <div id="poem">
            give me a word<br>
            and i will give it<br>
            somewhere else to exist
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="wordInput"
            placeholder="type a word..."
            autocomplete="off"
        >

        <button onclick="makePoem()">→</button>

        <div class="hint">
            try: ghost, window, ocean, sleep, home
        </div>
    </div>

</div>


<script>

const beginnings = [
    "i found a word hiding inside",
    "someone left the word",
    "the word",
    "i kept thinking about",
    "there was a little",
    "at the bottom of the sentence was",
    "nobody told me about"
];

const middles = [
    "like it had been waiting for me",
    "and it looked different in the dark",
    "which is another way of saying",
    "until it started to mean something else",
    "and for a moment i believed it",
    "as if language had forgotten what it was doing",
    "but words are strange little machines"
];

const endings = [
    "so i put it in my pocket",
    "and now i cannot stop thinking about it",
    "and maybe that is enough",
    "and the word kept growing",
    "until there was no sentence left",
    "and then it became a door",
    "and then it became you"
];


function randomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}


function makePoem() {

    const input = document.getElementById("wordInput");
    const word = input.value.trim();

    if (!word) {
        document.getElementById("poem").innerHTML =
            "you forgot the word<br>try again";
        return;
    }

    const poem =

        randomItem(beginnings) + " <span class='word'>" +
        escapeHTML(word) +
        "</span>\n\n" +

        randomItem(middles) + "\n" +

        escapeHTML(word) +
        " / " +
        escapeHTML(word) +
        " / " +
        escapeHTML(word) +
        "\n\n" +

        randomItem(endings) + ".";

    document.getElementById("poem").innerHTML = poem;
}


function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}


document.getElementById("wordInput").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        makePoem();
    }
});

</script>

</body>
</html>
