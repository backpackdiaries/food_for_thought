<!DOCTYPE html>
<html>
<head>
    <title>The 𝒟oor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="images/icon.png">

    <style>

        /* =========================
           GENERAL PAGE
           ========================= */

        body {
            font-family: monospace;
            color: fuchsia;
            background-color: #02010f;
            font-size: 14px;

            margin: 0;
            min-height: 100vh;
        }


        /* =========================
           LINKS
           ========================= */

        a {
            color: rgb(105, 255, 150);
            text-decoration: none;
        }


        /* =========================
           BACK TO INDEX
           ========================= */

        .back-button {
            position: absolute;
            top: 15px;
            left: 15px;

            font-size: 16px;
        }


        /* =========================
           CENTER CONTENT
           ========================= */

        .photo-container {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            text-align: center;

            width: 90%;
        }


        /* =========================
           FIRST / CLICKABLE IMAGE
           ========================= */

        .photo {
            max-width: 300px;
            width: 80%;
            height: auto;

            cursor: pointer;

            border-radius: 8px;
        }


        .photo:hover {
            opacity: 0.85;
        }


        /* =========================
           REVEALED CONTENT
           ========================= */

        .revealed-content {
            display: none;
        }


        .revealed-photo {
            max-width: 300px;
            width: 80%;
            height: auto;

            border-radius: 8px;
        }


        /* =========================
           CAPTION
           ========================= */

        .caption {
            margin-top: 12px;
            font-size: 12px;
        }


        /* =========================
           RAINBOW ENTER BUTTON
           ========================= */

        .enter-button {
            display: inline-block;

            color: rgb(105, 255, 150);

            border: 4px solid transparent;
            border-radius: 6px;

            padding: 4px 10px;

            font-family: monospace;
            font-size: 12px;
            line-height: 1;

            background:
                linear-gradient(#02010f, #02010f) padding-box,
                linear-gradient(
                    90deg,
                    #ff00ff,
                    #ff0080,
                    #ff0000,
                    #ffff00,
                    #00ff00,
                    #00ffff,
                    #0080ff,
                    #8000ff,
                    #ff00ff
                ) border-box;

            background-size: 100% 100%, 300% 100%;
            background-position: 0 0, 0% 50%;

            animation: rainbow-border 8s linear infinite;

            -webkit-text-fill-color: rgb(105, 255, 150);
        }


        @keyframes rainbow-border {

            0% {
                background-position: 0 0, 0% 50%;
            }

            100% {
                background-position: 0 0, 300% 50%;
            }

        }


        /* =========================
           ENTER HOVER
           ========================= */

        .enter-button:hover {
            color: fuchsia;
            -webkit-text-fill-color: fuchsia;
        }


        /* =========================
           DESKTOP
           ========================= */

        @media (min-width: 768px) {

            .photo,
            .revealed-photo {
                max-width: 350px;
            }

            .caption {
                font-size: 13px;
            }

        }

    </style>
</head>


<body>

    <!-- =========================
         BACK TO INDEX
         ========================= -->

    <a class="back-button" href="food_for_thought.html">
        ╾━╤デ╦︻
    </a>


    <!-- =========================
         CENTERED CONTENT
         ========================= -->

    <div class="photo-container">


        <!-- FIRST IMAGE -->

        <div id="door-image">

            <img
                class="photo"
                src="images/shoes_new.png"
                alt="cross"
                onclick="revealDoor()"
            >

            <p class="caption">
                please take off your digital shoes...
            </p>

        </div>


        <!-- REVEALED IMAGE + ENTER -->

        <div id="revealed-content" class="revealed-content">

            <img
                class="revealed-photo"
                src="images/foot_2.png"
                alt="feet"
            >

            <p class="caption">

                <a class="enter-button" href="digital_altar.html">
                    𝐄𝐧𝐭𝐞𝐫
                </a>

            </p>

        </div>


    </div>


    <!-- =========================
         IMAGE REVEAL
         ========================= -->

    <script>

        function revealDoor() {

            document.getElementById("door-image").style.display = "none";

            document.getElementById("revealed-content").style.display = "block";

        }

    </script>


</body>
</html>
