<!DOCTYPE html>
<html>
<head>
    <title>The 𝒟oor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="images/icon.png">

    <style>

        /* =========================
           GENERAL PAGE
           ========================= */

        body {
            font-family: monospace;
            color: fuchsia;
            background-color: #02010f;
            font-size: 14px;

            margin: 0;
            min-height: 100vh;
        }


        /* =========================
           LINKS
           ========================= */

        a {
            color: rgb(105, 255, 150);
            text-decoration: none;
        }


        /* =========================
           BACK TO INDEX
           ========================= */

        .back-button {
            position: absolute;
            top: 15px;
            left: 15px;

            font-size: 16px;
        }


        /* =========================
           CENTER PHOTO + CAPTION
           ========================= */

        .photo-container {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            text-align: center;

            width: 90%;
        }


        .photo {
            max-width: 300px;
            width: 80%;
            height: auto;
        }


        .caption {
            margin-top: 12px;
            font-size: 12px;
        }


        /* =========================
           RAINBOW ENTER BUTTON
           ========================= */

        .enter-button {
            display: inline-block;

            color: rgb(105, 255, 150);

            border: 1px solid transparent;
            border-radius: 6px;

            padding: 4px 10px;

            font-family: monospace;
            font-size: 12px;
            line-height: 1;

            /* Dark center + rainbow border */

            background:
                linear-gradient(#02010f, #02010f) padding-box,
                linear-gradient(
                    90deg,
                    #ff00ff,
                    #ff0080,
                    #ff0000,
                    #ffff00,
                    #00ff00,
                    #00ffff,
                    #0080ff,
                    #8000ff,
                    #ff00ff
                ) border-box;

            background-size: 100% 100%, 300% 100%;
            background-position: 0 0, 0% 50%;

            animation: rainbow-border 8s linear infinite;

            /* Prevent the general link styling
               from affecting the button text */

            -webkit-text-fill-color: rgb(105, 255, 150);
        }


        @keyframes rainbow-border {

            0% {
                background-position: 0 0, 0% 50%;
            }

            100% {
                background-position: 0 0, 300% 50%;
            }

        }


        /* ENTER HOVER */

        .enter-button:hover {
            color: fuchsia;
            -webkit-text-fill-color: fuchsia;
        }


        /* =========================
           DESKTOP
           ========================= */

        @media (min-width: 768px) {

            .photo {
                max-width: 350px;
            }

            .caption {
                font-size: 13px;
            }

        }

    </style>
</head>


<body>

    <!-- =========================
         BACK TO INDEX
         ========================= -->

    <a class="back-button" href="index.html">
        ╾━╤デ╦︻
    </a>


    <!-- =========================
         CENTERED PHOTO + CAPTION
         ========================= -->

    <div class="photo-container">

        <img
            class="photo"
            src="images/cross_1.GIF"
            alt="cross"
        >

        <p class="caption">
            please take off your digital shoes, and you may <br><br>
            <a class="enter-button" href="digital_altar.html">ENTER</a>
        </p>

    </div>


</body>
</html>
