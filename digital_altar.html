<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>digital altar</title>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icon.png" type="image/png">
<link rel="apple-touch-icon" href="images/icon.png">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  font-family: monospace;
  color: fuchsia;
  background-color: #02010f;
  overflow: hidden;
  padding: 0;
  touch-action: none;
}


/* =========================================================
   FULL-SCREEN DRAGGABLE SPACE
   ========================================================= */

#table {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;
  margin: 0;

  touch-action: none;
}


/* =========================================================
   IMAGES
   ========================================================= */

.object {
  position: absolute;

  height: auto;

  /*
    x/y represent the CENTER of each image.
  */
  transform: translate(-50%, -50%);

  user-select: none;
  -webkit-user-select: none;

  touch-action: none;

  -webkit-user-drag: none;

  cursor: grab;

  display: block;
}

.object.dragging {
  cursor: grabbing;
}
</style>
</head>


<body>

<main id="table"></main>


<script>

/* =========================================================
   OBJECTS
   =========================================================

   EDIT YOUR IMAGES HERE.

   desktopSize = image width on desktop
   mobileSize  = image width on phones

   x = horizontal starting position
   y = vertical starting position

   x/y are percentages of the ACTUAL SCREEN.

   x Horizontal position. 
   0 = far left 
   50 = center 
   100 = far right 
   
   y Vertical position. 
   0 = top 
   50 = center 
   100 = bottom

   ========================================================= */

const objects = [

   {
    image: "images/yogananda_1.png",

    desktopSize: 150,
    mobileSize: 85,

    x: 60,
    y: 50
  },

  {
    image: "images/marigold_1.png",

    desktopSize: 500,
    mobileSize: 300,

    x: 50,
    y: 15,
  },


   {
    image: "images/candle_2.GIF",

    desktopSize: 100,
    mobileSize: 50,

    x: 10,
    y: 73
  },

   {
    image: "images/buddha.png",

    desktopSize: 150,
    mobileSize: 70,

    x: 20,
    y: 70
  },



   {
    image: "images/yukimi_frame.png",

    desktopSize: 215,
    mobileSize: 125,

    x: 42,
    y: 67
  },

  {
    image: "images/guadalupe_1.png",

    desktopSize: 150,
    mobileSize: 90,

    x: 30,
    y: 73
  },


   {
    image: "images/flowers_2.png",

    desktopSize: 300,
    mobileSize: 150,

    x: 28,
    y: 75,
  },

   {
    image: "images/candle_3.GIF",

    desktopSize: 75,
    mobileSize: 47,

    x: 90,
    y: 75
  },

  {
    image: "images/ganesha.jpg",

    desktopSize: 200,
    mobileSize: 95,

    x: 75,
    y: 70
  },

   {
    image: "images/kali_1.png",

    desktopSize: 130,
    mobileSize: 75,

    x: 52,
    y: 70
  },


  {
    image: "images/flowers_1.png",

    desktopSize: 300,
    mobileSize: 150,

    x: 85,
    y: 65
  },

   {
    image: "images/lotus_1.png",

    desktopSize: 100,
    mobileSize: 80,

    x: 73,
    y: 80,
  },

];


/* =========================================================
   SETUP
   ========================================================= */

const table = document.getElementById("table");

let highestZIndex = 1;


/* =========================================================
   MOBILE DETECTION
   ========================================================= */

function isMobile() {
  return window.innerWidth < 768;
}


/* =========================================================
   IMAGE SIZE
   ========================================================= */

function getObjectSize(object) {

  if (isMobile()) {
    return object.mobileSize;
  }

  return object.desktopSize;
}


/* =========================================================
   CREATE IMAGES
   ========================================================= */

objects.forEach(function(objectData, index) {

  const img = document.createElement("img");

  img.src = objectData.image;

  img.classList.add("object");

  img.dataset.index = index;

  img.draggable = false;


  /* -------------------------------------------------------
     PREVENT NATIVE IMAGE DRAGGING
     ------------------------------------------------------- */

  img.addEventListener("dragstart", function(event) {
    event.preventDefault();
  });


  /* -------------------------------------------------------
     IMAGE SIZE
     ------------------------------------------------------- */

  img.style.width =
    getObjectSize(objectData) + "px";


  /* -------------------------------------------------------
     INITIAL POSITION
     ------------------------------------------------------- */

  img.style.left =
    objectData.x + "%";

  img.style.top =
    objectData.y + "%";


  /* -------------------------------------------------------
     Z-INDEX
     ------------------------------------------------------- */

  img.style.zIndex = ++highestZIndex;


  /* =======================================================
     DRAGGING
     ======================================================= */

  let dragging = false;

  let offsetX = 0;
  let offsetY = 0;


  /* =======================================================
     TOUCH / MOUSE DOWN
     ======================================================= */

  img.addEventListener("pointerdown", function(event) {

    event.preventDefault();

    dragging = true;

    img.classList.add("dragging");


    /* Bring selected object to front */

    highestZIndex++;

    img.style.zIndex = highestZIndex;


    /* Keep receiving pointer events */

    img.setPointerCapture(event.pointerId);


    /* Calculate click/finger offset */

    const imageRect =
      img.getBoundingClientRect();

    const imageCenterX =
      imageRect.left +
      imageRect.width / 2;

    const imageCenterY =
      imageRect.top +
      imageRect.height / 2;


    offsetX =
      event.clientX - imageCenterX;

    offsetY =
      event.clientY - imageCenterY;

  });


  /* =======================================================
     DRAG
     ======================================================= */

  img.addEventListener("pointermove", function(event) {

    if (!dragging) {
      return;
    }

    event.preventDefault();


    const tableRect =
      table.getBoundingClientRect();

    const imageRect =
      img.getBoundingClientRect();


    /* Calculate new center position */

    let x =
      event.clientX
      - tableRect.left
      - offsetX;

    let y =
      event.clientY
      - tableRect.top
      - offsetY;


    /* Half image dimensions */

    const halfWidth =
      imageRect.width / 2;

    const halfHeight =
      imageRect.height / 2;


    /* -----------------------------------------------------
       KEEP IMAGE INSIDE SCREEN
       ----------------------------------------------------- */

    x = Math.max(
      halfWidth,
      Math.min(
        tableRect.width - halfWidth,
        x
      )
    );

    y = Math.max(
      halfHeight,
      Math.min(
        tableRect.height - halfHeight,
        y
      )
    );


    /* Apply position */

    img.style.left =
      x + "px";

    img.style.top =
      y + "px";

  });


  /* =======================================================
     POINTER UP
     ======================================================= */

  img.addEventListener("pointerup", function(event) {

    dragging = false;

    img.classList.remove("dragging");


    if (img.hasPointerCapture(event.pointerId)) {
      img.releasePointerCapture(event.pointerId);
    }

  });


  /* =======================================================
     POINTER CANCEL
     ======================================================= */

  img.addEventListener("pointercancel", function(event) {

    dragging = false;

    img.classList.remove("dragging");


    if (img.hasPointerCapture(event.pointerId)) {
      img.releasePointerCapture(event.pointerId);
    }

  });


  /* -------------------------------------------------------
     ADD IMAGE TO SCREEN
     ------------------------------------------------------- */

  table.appendChild(img);

});


/* =========================================================
   SCREEN RESIZE
   ========================================================= */

let previousMobileState = isMobile();


function updateForScreenSize() {

  const currentMobileState =
    isMobile();

  const screenChanged =
    currentMobileState !== previousMobileState;


  const tableRect =
    table.getBoundingClientRect();


  document
    .querySelectorAll(".object")
    .forEach(function(img) {

      const index =
        Number(img.dataset.index);

      const objectData =
        objects[index];


      /* ---------------------------------------------------
         SWITCH DESKTOP / MOBILE SIZE
         --------------------------------------------------- */

      if (screenChanged) {

        img.style.width =
          getObjectSize(objectData) + "px";

      }


      /* ---------------------------------------------------
         GET CURRENT POSITION
         --------------------------------------------------- */

      let x =
        parseFloat(img.style.left);

      let y =
        parseFloat(img.style.top);


      /*
        If the image has not been dragged yet,
        its position is still a percentage.
      */

      if (img.style.left.includes("%")) {

        x =
          tableRect.width *
          parseFloat(img.style.left) /
          100;

      }

      if (img.style.top.includes("%")) {

        y =
          tableRect.height *
          parseFloat(img.style.top) /
          100;

      }


      /* ---------------------------------------------------
         KEEP IMAGE INSIDE NEW SCREEN
         --------------------------------------------------- */

      const imageRect =
        img.getBoundingClientRect();

      const halfWidth =
        imageRect.width / 2;

      const halfHeight =
        imageRect.height / 2;


      x = Math.max(
        halfWidth,
        Math.min(
          tableRect.width - halfWidth,
          x
        )
      );

      y = Math.max(
        halfHeight,
        Math.min(
          tableRect.height - halfHeight,
          y
        )
      );


      img.style.left =
        x + "px";

      img.style.top =
        y + "px";

    });


  previousMobileState =
    currentMobileState;
}


/* =========================================================
   RESIZE LISTENER
   ========================================================= */

let resizeTimer;

window.addEventListener("resize", function() {

  clearTimeout(resizeTimer);

  resizeTimer = setTimeout(function() {

    updateForScreenSize();

  }, 100);

});

</script>

</body>
</html>
