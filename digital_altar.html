<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>digital altar</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">

    <link rel="icon"
          href="images/icon.png"
          type="image/png">

    <link rel="apple-touch-icon"
          href="images/icon.png">


    <style>

    /* =========================================================
       BASIC PAGE
       ========================================================= */

    * {
        box-sizing: border-box;
    }


    html,
    body {

        margin: 0;

        width: 100%;
        height: 100%;

    }


    body {

        font-family: monospace;

        color: fuchsia;

        background-color: #02010f;

        font-size: 14px;

        padding: 10px;

        overflow: hidden;

    }


    a {

        color: rgb(105, 255, 150);

        text-decoration: none;

    }



    /* =========================================================
       ROOM / SCENE
       =========================================================

       This is the invisible room.

       The room uses a fixed internal coordinate system.
       Objects are positioned inside that coordinate system.

       The browser then scales the entire room to fit the
       available screen.

       ========================================================= */

    #table {

        position: relative;

        width: 100%;
        height: 100%;

        margin: 0 auto;

        overflow: hidden;

    }



    /* =========================================================
       SCENE
       =========================================================

       This is the actual design space.

       Think of it like a large invisible piece of paper.

       Objects are placed inside this space.

       ========================================================= */

    #scene {

        position: absolute;

        width: 1600px;
        height: 1000px;

        left: 50%;
        top: 50%;

        transform-origin: center center;

        /*
         * The scene itself is translated so its center
         * sits in the center of the screen.
         */
        transform:
            translate(-50%, -50%)
            scale(1);

    }



    /* =========================================================
       OBJECTS
       ========================================================= */

    .object {

        position: absolute;

        height: auto;

        /*
         * Objects are positioned using their CENTER.
         */
        transform: translate(-50%, -50%);

        /*
         * Prevent selection.
         */
        user-select: none;

        -webkit-user-select: none;

        /*
         * Essential for touch dragging.
         */
        touch-action: none;

        /*
         * Mouse cursor.
         */
        cursor: grab;

        /*
         * Prevent native image dragging.
         */
        -webkit-user-drag: none;

        /*
         * Prevent image rendering from causing
         * unexpected inline spacing.
         */
        display: block;

    }


    .object.dragging {

        cursor: grabbing;

    }



    /* =========================================================
       DESKTOP
       ========================================================= */

    @media (min-width: 768px) {

        body {

            padding: 15px;

        }

    }



    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 767px) {

        body {

            padding: 10px;

        }

    }

    </style>

</head>



<body>


    <!-- =======================================================
         ROOM
         ======================================================= -->

    <main id="table">

        <div id="scene"></div>

    </main>



    <script>


    /* =========================================================
       =========================================================
       
       DIGITAL ALTAR / ROOM CONFIGURATION
       
       =========================================================
       
       THIS IS THE MAIN SECTION YOU EDIT.
       
       To add an object, copy one block and change:
       
           image
           size
           x
           y
       
       That's it.
       
       ---------------------------------------------------------
       
       image
           The image file.
       
       size
           Width of the object inside the desktop room.
       
       x
           Horizontal position.
       
           0   = far left
           50  = center
           100 = far right
       
       y
           Vertical position.
       
           0   = top
           50  = center
           100 = bottom
       
       =========================================================
       ========================================================= */


    const objects = [


        {
    image: "images/buddha.png",

    desktopSize: 300,

    mobileSize: 180,

    x: 20,
    y: 50
},

        {
            image: "images/yukimi_3.jpg",

            desktopSize: 300,
            mobileSize: 180,

            x: 40,
            y: 50
        },


        {
            image: "images/yogananda.jpg",

            desktopSize: 200,
            mobileSize: 180,

            x: 60,
            y: 50
        },


        {
            image: "images/ganesha.jpg",

            desktopSize: 280,
            mobileSize: 180,

            x: 80,
            y: 50
        },


        /*
         * =====================================================
         * ADD MORE OBJECTS HERE
         * =====================================================
         *
         * Example:
         *
         *
         * {
         *     image: "images/plant.png",
         *
         *     size: 240,
         *
         *     x: 25,
         *     y: 70
         * },
         *
         *
         * You can add as many objects as you want.
         *
         */


    ];



    /* =========================================================
       ROOM SETTINGS
       =========================================================

       These settings control the invisible room itself.

       You normally won't need to change these.

       ========================================================= */

    const room = {


        /*
         * Internal room dimensions.
         *
         * Think of this as the size of your desktop
         * design canvas.
         */

        width: 1600,

        height: 1000,


        /*
         * Minimum amount of space kept around the room
         * on phones.
         */

        mobileMargin: 12,


        /*
         * Desktop scale.
         *
         * 1 = full-size room.
         */

        desktopScale: 1

    };



    /* =========================================================
       GET ELEMENTS
       ========================================================= */

    const table =
        document.getElementById("table");


    const scene =
        document.getElementById("scene");



    /* =========================================================
       Z-INDEX
       =========================================================

       The most recently selected object always goes
       above the others.

       ========================================================= */

    let highestZIndex = 1;



    /* =========================================================
       MOBILE DETECTION
       ========================================================= */

    function isMobile() {

        return window.innerWidth < 768;

    }



    /* =========================================================
       CALCULATE SCENE SCALE
       =========================================================

       DESKTOP:
           Uses the large desktop room.

       MOBILE:
           Automatically scales the entire room so it fits
           inside the phone screen.

       This means you NEVER need to specify a separate
       mobileWidth for every object.

       ========================================================= */

    function calculateSceneScale() {


        const tableWidth =
            table.clientWidth;


        const tableHeight =
            table.clientHeight;



        /*
         * Desktop:
         *
         * Use the room at its normal size unless the
         * available browser window is smaller than the
         * room.
         */

        if (!isMobile()) {


            const horizontalScale =
                tableWidth / room.width;


            const verticalScale =
                tableHeight / room.height;


            /*
             * Don't allow the desktop room to become
             * ridiculously small.
             */

            return Math.min(

                room.desktopScale,

                horizontalScale,
                verticalScale

            );

        }



        /*
         * MOBILE
         *
         * Leave a little breathing room around the scene.
         */

        const availableWidth =
            tableWidth -
            (room.mobileMargin * 2);


        const availableHeight =
            tableHeight -
            (room.mobileMargin * 2);



        const horizontalScale =
            availableWidth /
            room.width;


        const verticalScale =
            availableHeight /
            room.height;



        /*
         * Use whichever dimension is more restrictive.
         */

        return Math.min(

            horizontalScale,
            verticalScale

        );

    }



    /* =========================================================
       APPLY SCENE SCALE
       ========================================================= */

    function updateSceneScale() {


        const scale =
            calculateSceneScale();


        scene.style.transform =

            "translate(-50%, -50%) " +
            "scale(" + scale + ")";

    }



    /* =========================================================
       CREATE OBJECTS
       ========================================================= */

    objects.forEach(function(item, index) {


        /*
         * Create image.
         */

        const img =
            document.createElement("img");



        /*
         * Set image source.
         */

        img.src =
            item.image;



        /*
         * CSS class.

         */

        img.classList.add("object");



        /*
         * Store object number.
         */

        img.dataset.index =
            index;



        /*
         * Disable native image dragging.
         */

        img.draggable = false;



        img.addEventListener(

            "dragstart",

            function(event) {

                event.preventDefault();

            }

        );



        /* =====================================================
           SIZE
           =====================================================

           One size works everywhere.

           Mobile responsiveness is handled by scaling
           the entire scene.

           ===================================================== */

        img.style.width =
    (isMobile()
        ? item.mobileSize
        : item.desktopSize) + "px";


        /* =====================================================
           POSITION
           =====================================================

           Convert percentage coordinates into the internal
           room coordinates.

           ===================================================== */

        img.style.left =
            (room.width * item.x / 100) + "px";


        img.style.top =
            (room.height * item.y / 100) + "px";



        /* =====================================================
           DRAG VARIABLES
           ===================================================== */

        let dragging = false;

        let offsetX = 0;

        let offsetY = 0;



        /* =====================================================
           POINTER DOWN
           ===================================================== */

        img.addEventListener(

            "pointerdown",

            function(event) {


                event.preventDefault();


                dragging = true;


                img.classList.add(
                    "dragging"
                );



                /*
                 * Bring object to front.
                 */

                highestZIndex++;

                img.style.zIndex =
                    highestZIndex;



                /*
                 * Continue receiving pointer events
                 * during the drag.
                 */

                img.setPointerCapture(
                    event.pointerId
                );



                /*
                 * Because the scene itself is scaled,
                 * convert pointer coordinates back into
                 * room coordinates.
                 */

                const sceneScale =
                    calculateSceneScale();


                const sceneRect =
                    scene.getBoundingClientRect();



                /*
                 * Current object center.
                 */

                const objectX =
                    parseFloat(
                        img.style.left
                    );


                const objectY =
                    parseFloat(
                        img.style.top
                    );



                /*
                 * Pointer position in room coordinates.
                 */

                const pointerX =

                    (
                        event.clientX -
                        sceneRect.left
                    ) /
                    sceneScale;


                const pointerY =

                    (
                        event.clientY -
                        sceneRect.top
                    ) /
                    sceneScale;



                /*
                 * Remember where inside the object
                 * the user grabbed it.
                 */

                offsetX =
                    pointerX -
                    objectX;


                offsetY =
                    pointerY -
                    objectY;

            }

        );



        /* =====================================================
           POINTER MOVE
           ===================================================== */

        img.addEventListener(

            "pointermove",

            function(event) {


                if (!dragging) return;


                event.preventDefault();



                const sceneScale =
                    calculateSceneScale();


                const sceneRect =
                    scene.getBoundingClientRect();



                /*
                 * Pointer position converted into
                 * room coordinates.
                 */

                let x =

                    (
                        event.clientX -
                        sceneRect.left
                    ) /
                    sceneScale -
                    offsetX;



                let y =

                    (
                        event.clientY -
                        sceneRect.top
                    ) /
                    sceneScale -
                    offsetY;



                /*
                 * Object dimensions inside the
                 * unscaled room.
                 */

                const objectWidth =
                    img.offsetWidth;


                const objectHeight =
                    img.offsetHeight;



                /*
                 * Keep the entire object inside
                 * the room horizontally.
                 */

                const halfWidth =
                    objectWidth / 2;


                const halfHeight =
                    objectHeight / 2;



                x = Math.max(

                    halfWidth,

                    Math.min(

                        room.width -
                        halfWidth,

                        x

                    )

                );



                /*
                 * Keep the entire object inside
                 * the room vertically.
                 */

                y = Math.max(

                    halfHeight,

                    Math.min(

                        room.height -
                        halfHeight,

                        y

                    )

                );



                /*
                 * Move object.
                 */

                img.style.left =
                    x + "px";


                img.style.top =
                    y + "px";

            }

        );



        /* =====================================================
           POINTER UP
           ===================================================== */

        img.addEventListener(

            "pointerup",

            function(event) {


                dragging = false;


                img.classList.remove(
                    "dragging"
                );



                if (

                    img.hasPointerCapture(
                        event.pointerId
                    )

                ) {

                    img.releasePointerCapture(
                        event.pointerId
                    );

                }

            }

        );



        /* =====================================================
           POINTER CANCEL
           ===================================================== */

        img.addEventListener(

            "pointercancel",

            function(event) {


                dragging = false;


                img.classList.remove(
                    "dragging"
                );



                if (

                    img.hasPointerCapture(
                        event.pointerId
                    )

                ) {

                    img.releasePointerCapture(
                        event.pointerId
                    );

                }

            }

        );



        /* =====================================================
           ADD TO SCENE
           ===================================================== */

        scene.appendChild(img);

    });



    /* =========================================================
       INITIAL SCALE
       ========================================================= */

    updateSceneScale();



    /* =========================================================
       RESIZE
       =========================================================

       Recalculate the scene whenever the browser changes
       size or orientation.

       ========================================================= */

    let resizeTimer;


    window.addEventListener(

        "resize",

        function() {


            clearTimeout(resizeTimer);


            resizeTimer = setTimeout(

                function() {

                    updateSceneScale();

                },

                100

            );

        }

    );



    </script>

</body>

</html>
