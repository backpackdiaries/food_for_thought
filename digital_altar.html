<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>digital altar</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">

    <link rel="icon"
          href="images/icon.png"
          type="image/png">

    <link rel="apple-touch-icon"
          href="images/icon.png">


    <style>

    /* =========================================================
       BASIC PAGE
       ========================================================= */

    * {
        box-sizing: border-box;
    }


    html,
    body {

        margin: 0;

        width: 100%;
        height: 100%;

    }


    body {

        font-family: monospace;

        color: fuchsia;

        background-color: #02010f;

        font-size: 14px;

        /*
         * Space around the page.
         */
        padding: 10px;

        /*
         * Prevents the browser from scrolling while
         * an object is being dragged.
         */
        overflow: hidden;

    }


    a {

        color: rgb(105, 255, 150);

        text-decoration: none;

    }



    /* =========================================================
       INVISIBLE TABLE
       =========================================================

       This is the area where the images live.

       You can temporarily uncomment the border below
       if you want to see it while designing.

       ========================================================= */

    #table {

        position: relative;

        width: min(1400px, 100%);

        height: calc(100vh - 20px);

        margin: 0 auto;

        overflow: hidden;

        /*
        border: 1px dashed fuchsia;
        */

    }



    /* =========================================================
       DRAGGABLE IMAGES
       ========================================================= */

    .object {

        position: absolute;

        height: auto;

        /*
         * The image is positioned by its CENTER horizontally
         * and its BOTTOM vertically.
         */
        transform: translate(-50%, -100%);


        /*
         * Prevent text/image selection.
         */
        user-select: none;

        -webkit-user-select: none;


        /*
         * Important for touch screens.
         */
        touch-action: none;


        /*
         * Mouse cursor.
         */
        cursor: grab;


        /*
         * Prevent native browser image dragging.
         */
        -webkit-user-drag: none;

    }


    .object.dragging {

        cursor: grabbing;

    }



    /* =========================================================
       DESKTOP
       ========================================================= */

    @media (min-width: 768px) {

        body {

            padding: 15px;

        }


        #table {

            height: calc(100vh - 30px);

        }

    }



    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 767px) {

        body {

            padding: 10px;

        }


        #table {

            height: calc(100vh - 20px);

        }

    }

    </style>

</head>



<body>


    <!-- =======================================================
         INVISIBLE TABLE
         ======================================================= -->

    <main id="table"></main>



    <script>


    /* =========================================================
       =========================================================

       IMAGE CONFIGURATION

       THIS IS THE MAIN SECTION YOU WILL EDIT.

       To add an image, simply copy one of the blocks below.

       You only need to change:

           src
           width
           mobileWidth

       You do NOT need to calculate positions.

       =========================================================
       ========================================================= */


    const images = [


        {
            src: "images/buddha.png",

            /*
             * Desktop width.
             */
            width: 60,

            /*
             * Phone width.
             */
            mobileWidth: 130
        },


        {
            src: "images/yukimi_3.jpg",

            width: 70,

            mobileWidth: 110
        },


        {
            src: "images/yoganada.jpg",

            width: 50,

            mobileWidth: 150
        },


        {
            src: "images/ganesha.jpg",

            width: 70,

            mobileWidth: 170
        },


        /*
         * ADD MORE IMAGES HERE
         *
         * Example:
         *
         * {
         *     src: "images/new-image.png",
         *
         *     width: 280,
         *
         *     mobileWidth: 140
         * },
         *
         */


    ];



    /* =========================================================
       =========================================================

       LAYOUT SETTINGS

       These control the entire row.

       =========================================================
       ========================================================= */


    const layout = {


        /*
         * =====================================================
         * INVISIBLE TABLE / BASELINE
         * =====================================================

         * 50 = exactly the middle of the page.
         *
         * This is where the BOTTOM of every image sits.
         *
         * 45 = higher
         * 50 = center
         * 55 = lower
         */

        desktopBaseline: 50,

        mobileBaseline: 50,



        /*
         * =====================================================
         * SPACING BETWEEN IMAGES
         * =====================================================

         * Positive number:
         *     space between images
         *
         * 0:
         *     images touch
         *
         * Negative number:
         *     images overlap
         *
         * Example:
         *
         * -20 = slight overlap
         * -40 = more overlap
         * 20  = space between images
         */

        desktopSpacing: -20,

        mobileSpacing: -10

    };



    /* =========================================================
       TABLE
       ========================================================= */

    const table =
        document.getElementById("table");



    /* =========================================================
       Z-INDEX
       =========================================================

       Every time an image is selected, this number increases.

       This makes the selected image appear above all the
       other images.

       ========================================================= */

    let highestZIndex = 1;



    /* =========================================================
       DETECT MOBILE
       ========================================================= */

    function isMobile() {

        return window.innerWidth < 768;

    }



    /* =========================================================
       GET IMAGE WIDTH
       ========================================================= */

    function getImageWidth(item) {

        if (isMobile()) {

            return item.mobileWidth || item.width;

        }

        return item.width;

    }



    /* =========================================================
       CALCULATE STARTING ROW
       =========================================================

       This automatically calculates where every image should
       start.

       The entire row is centered horizontally.

       Every image shares the same bottom baseline.

       ========================================================= */

    function calculateLayout() {


        const spacing =

            isMobile()

                ? layout.mobileSpacing

                : layout.desktopSpacing;



        /*
         * Get the width of every image.
         */

        const widths =

            images.map(function(item) {

                return getImageWidth(item);

            });



        /*
         * Calculate total width of the row.
         */

        const totalWidth =

            widths.reduce(

                function(total, width) {

                    return total + width;

                },

                0

            )

            +

            spacing *
            (images.length - 1);



        /*
         * Start at the left side of the centered row.
         */

        let currentX =

            (table.clientWidth - totalWidth) / 2;



        /*
         * Create a position for each image.
         */

        return images.map(function(item, index) {


            const width =
                widths[index];


            /*
             * The image's horizontal CENTER.
             */

            const centerX =

                currentX +
                (width / 2);



            /*
             * Move to the next image.
             */

            currentX +=

                width +
                spacing;



            return {

                x: centerX,

                baseline:

                    isMobile()

                        ? layout.mobileBaseline

                        : layout.desktopBaseline

            };

        });

    }



    /* =========================================================
       CREATE IMAGES
       ========================================================= */

    const startingPositions =
        calculateLayout();



    images.forEach(function(item, index) {


        const img =
            document.createElement("img");



        /*
         * Image file.
         */

        img.src = item.src;



        /*
         * CSS class.
         */

        img.classList.add("object");



        /*
         * Store image number.
         */

        img.dataset.index = index;



        /*
         * Disable native browser dragging.
         */

        img.draggable = false;



        img.addEventListener(

            "dragstart",

            function(event) {

                event.preventDefault();

            }

        );



        /* =====================================================
           IMAGE SIZE
           ===================================================== */

        img.style.width =
            getImageWidth(item) + "px";



        /* =====================================================
           INITIAL POSITION
           ===================================================== */

        img.style.left =
            startingPositions[index].x + "px";


        img.style.top =
            startingPositions[index].baseline + "%";



        /* =====================================================
           DRAG VARIABLES
           ===================================================== */

        let dragging = false;

        let offsetX = 0;

        let offsetY = 0;



        /* =====================================================
           POINTER DOWN
           ===================================================== */

        img.addEventListener(

            "pointerdown",

            function(event) {


                event.preventDefault();


                dragging = true;


                img.classList.add(
                    "dragging"
                );


                /*
                 * Bring this image to the front.
                 */

                highestZIndex++;

                img.style.zIndex =
                    highestZIndex;



                /*
                 * Keep receiving pointer events
                 * while dragging.
                 */

                img.setPointerCapture(
                    event.pointerId
                );



                const imageRect =
                    img.getBoundingClientRect();



                /*
                 * Remember exactly where the user
                 * grabbed the image.
                 */

                offsetX =

                    event.clientX -

                    (
                        imageRect.left +
                        imageRect.width / 2
                    );


                offsetY =

                    event.clientY -

                    imageRect.top -
                    imageRect.height;

            }

        );



        /* =====================================================
           POINTER MOVE
           ===================================================== */

        img.addEventListener(

            "pointermove",

            function(event) {


                if (!dragging) return;


                event.preventDefault();



                const tableRect =
                    table.getBoundingClientRect();


                const imageRect =
                    img.getBoundingClientRect();



                /*
                 * Calculate new horizontal position.
                 */

                let x =

                    event.clientX -

                    tableRect.left -

                    offsetX;



                /*
                 * Calculate new vertical position.
                 */

                let y =

                    event.clientY -

                    tableRect.top -

                    offsetY;



                /*
                 * Keep image inside the table horizontally.
                 */

                x = Math.max(

                    imageRect.width / 2,

                    Math.min(

                        tableRect.width -
                        imageRect.width / 2,

                        x

                    )

                );



                /*
                 * Keep image inside the table vertically.
                 */

                y = Math.max(

                    imageRect.height,

                    Math.min(

                        tableRect.height,

                        y

                    )

                );



                /*
                 * Move image.
                 */

                img.style.left =
                    x + "px";


                img.style.top =
                    y + "px";

            }

        );



        /* =====================================================
           POINTER UP
           ===================================================== */

        img.addEventListener(

            "pointerup",

            function(event) {


                dragging = false;


                img.classList.remove(
                    "dragging"
                );



                if (

                    img.hasPointerCapture(
                        event.pointerId
                    )

                ) {

                    img.releasePointerCapture(
                        event.pointerId
                    );

                }

            }

        );



        /* =====================================================
           POINTER CANCEL
           ===================================================== */

        img.addEventListener(

            "pointercancel",

            function(event) {


                dragging = false;


                img.classList.remove(
                    "dragging"
                );



                if (

                    img.hasPointerCapture(
                        event.pointerId
                    )

                ) {

                    img.releasePointerCapture(
                        event.pointerId
                    );

                }

            }

        );



        /* =====================================================
           ADD TO TABLE
           ===================================================== */

        table.appendChild(img);

    });



    /* =========================================================
       RESIZE
       =========================================================

       If the browser changes between desktop/mobile dimensions,
       reload the initial arrangement so the row recalculates.

       ========================================================= */

    let resizeTimer;


    window.addEventListener(

        "resize",

        function() {


            clearTimeout(resizeTimer);


            resizeTimer = setTimeout(

                function() {

                    window.location.reload();

                },

                300

            );

        }

    );


    </script>

</body>

</html>
