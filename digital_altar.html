<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>digital altar</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">

    <link rel="icon"
          href="images/icon.png"
          type="image/png">

    <link rel="apple-touch-icon"
          href="images/icon.png">


    <style>

    /* =========================================================
       BASIC PAGE
       ========================================================= */

    * {
        box-sizing: border-box;
    }


    html,
    body {

        margin: 0;

        width: 100%;
        height: 100%;

    }


    body {

        font-family: monospace;

        color: fuchsia;

        background-color: #02010f;

        font-size: 14px;

        /*
         * Small breathing room around the screen.
         */
        padding: 10px;

        /*
         * Prevent the page itself from scrolling.
         */
        overflow: hidden;

    }


    a {

        color: rgb(105, 255, 150);

        text-decoration: none;

    }



    /* =========================================================
       FULL-SCREEN ROOM
       =========================================================

       The room now fills the entire available screen.

       There is NO fixed 1600px x 1000px canvas.

       This means objects can be dragged anywhere on the
       actual desktop or phone screen.

       ========================================================= */

    #table {

        position: relative;

        width: 100%;
        height: 100%;

        margin: 0;

        overflow: hidden;

    }



    /* =========================================================
       DRAGGABLE OBJECTS
       ========================================================= */

    .object {

        position: absolute;

        height: auto;

        /*
         * left/top represent the CENTER of the image.
         */
        transform: translate(-50%, -50%);

        /*
         * Prevent selection.
         */
        user-select: none;

        -webkit-user-select: none;

        /*
         * Essential for touch dragging.
         */
        touch-action: none;

        /*
         * Mouse cursor.
         */
        cursor: grab;

        /*
         * Prevent native browser image dragging.
         */
        -webkit-user-drag: none;

        /*
         * Removes inline-image spacing.
         */
        display: block;

    }


    .object.dragging {

        cursor: grabbing;

    }



    /* =========================================================
       DESKTOP
       ========================================================= */

    @media (min-width: 768px) {

        body {

            padding: 15px;

        }

    }



    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 767px) {

        body {

            padding: 10px;

        }

    }

    </style>

</head>



<body>


    <!-- =======================================================
         FULL-SCREEN ROOM
         ======================================================= -->

    <main id="table"></main>



    <script>


    /* =========================================================
       =========================================================

       DIGITAL ALTAR / ROOM CONFIGURATION

       =========================================================

       THIS IS THE MAIN SECTION YOU EDIT.

       To add an object, copy one of the blocks below.

       You only need to change:

           image
           desktopSize
           mobileSize
           x
           y

       =========================================================
       ========================================================= */


    const objects = [


        {
            image: "images/buddha.png",

            /*
             * Width on desktop.
             */
            desktopSize: 200,

            /*
             * Width on phone.
             */
            mobileSize: 280,

            /*
             * Horizontal position.
             *
             * 0   = left edge
             * 50  = center
             * 100 = right edge
             */
            x: 20,

            /*
             * Vertical position.
             *
             * 0   = top
             * 50  = center
             * 100 = bottom
             */
            y: 50
        },

        {
            image: "images/candle_1.GIF",

            desktopSize: 100,

            mobileSize: 190,

            x: 10,

            y: 50
        },

        {
            image: "images/yukimi_frame.png",

            desktopSize: 320,

            mobileSize: 190,

            x: 40,

            y: 50
        },


        {
            image: "images/yoganada_1.png",

            desktopSize: 240,

            mobileSize: 150,

            x: 60,

            y: 50
        },


        {
            image: "images/ganesha.jpg",

            desktopSize: 320,

            mobileSize: 190,

            x: 80,

            y: 50
        },


        /*
         * =====================================================
         * GIF EXAMPLE
         * =====================================================
         *
         * GIFs work exactly like PNGs and JPGs.
         *
         *
         * {
         *     image: "images/my-animation.gif",
         *
         *     desktopSize: 300,
         *
         *     mobileSize: 180,
         *
         *     x: 70,
         *
         *     y: 65
         * },
         *
         */


        /*
         * =====================================================
         * ADD MORE OBJECTS HERE
         * =====================================================
         *
         * Example:
         *
         *
         * {
         *     image: "images/plant.png",
         *
         *     desktopSize: 350,
         *
         *     mobileSize: 220,
         *
         *     x: 15,
         *
         *     y: 70
         * },
         *
         */


    ];



    /* =========================================================
       TABLE
       ========================================================= */

    const table =
        document.getElementById("table");



    /* =========================================================
       Z-INDEX
       =========================================================

       Every time an object is selected, its z-index increases.

       Therefore the most recently selected object is always
       placed above the others.

       ========================================================= */

    let highestZIndex = 1;



    /* =========================================================
       MOBILE DETECTION
       ========================================================= */

    function isMobile() {

        return window.innerWidth < 768;

    }



    /* =========================================================
       GET OBJECT SIZE
       =========================================================

       Each object can have a different size on desktop
       and mobile.

       ========================================================= */

    function getObjectSize(item) {

        if (isMobile()) {

            return item.mobileSize;

        }

        return item.desktopSize;

    }



    /* =========================================================
       CONVERT PERCENTAGE POSITION TO SCREEN POSITION
       ========================================================= */

    function getPosition(item) {


        return {

            x:
                table.clientWidth *
                (item.x / 100),

            y:
                table.clientHeight *
                (item.y / 100)

        };

    }



    /* =========================================================
       KEEP OBJECT INSIDE SCREEN
       =========================================================

       This is important.

       An object can be dragged anywhere across the screen,
       but its edges won't disappear beyond the screen.

       ========================================================= */

    function constrainPosition(

        x,
        y,
        image

    ) {


        const tableRect =
            table.getBoundingClientRect();



        const imageWidth =
            image.offsetWidth;


        const imageHeight =
            image.offsetHeight;



        /*
         * Because the image is centered using
         * translate(-50%, -50%), these are the
         * minimum and maximum CENTER positions.
         */

        const halfWidth =
            imageWidth / 2;


        const halfHeight =
            imageHeight / 2;



        /*
         * Horizontal boundary.
         */

        x = Math.max(

            halfWidth,

            Math.min(

                tableRect.width -
                halfWidth,

                x

            )

        );



        /*
         * Vertical boundary.
         */

        y = Math.max(

            halfHeight,

            Math.min(

                tableRect.height -
                halfHeight,

                y

            )

        );



        return {

            x: x,
            y: y

        };

    }



    /* =========================================================
       CREATE OBJECTS
       ========================================================= */

    objects.forEach(function(item, index) {


        /*
         * Create image.
         */

        const img =
            document.createElement("img");



        /*
         * Image source.
         */

        img.src =
            item.image;



        /*
         * CSS class.

         */

        img.classList.add("object");



        /*
         * Store object number.

         */

        img.dataset.index =
            index;



        /*
         * Disable native browser image dragging.
         */

        img.draggable = false;



        img.addEventListener(

            "dragstart",

            function(event) {

                event.preventDefault();

            }

        );



        /* =====================================================
           SIZE
           ===================================================== */

        img.style.width =
            getObjectSize(item) + "px";



        /* =====================================================
           INITIAL POSITION
           ===================================================== */

        const position =
            getPosition(item);



        img.style.left =
            position.x + "px";


        img.style.top =
            position.y + "px";



        /* =====================================================
           DRAG VARIABLES
           ===================================================== */

        let dragging = false;

        let offsetX = 0;

        let offsetY = 0;



        /* =====================================================
           POINTER DOWN
           ===================================================== */

        img.addEventListener(

            "pointerdown",

            function(event) {


                event.preventDefault();


                dragging = true;


                img.classList.add(
                    "dragging"
                );



                /*
                 * Bring selected object to front.
                 */

                highestZIndex++;

                img.style.zIndex =
                    highestZIndex;



                /*
                 * Keep receiving pointer events
                 * during the drag.
                 */

                img.setPointerCapture(
                    event.pointerId
                );



                /*
                 * Get the current image position.
                 */

                const imageRect =
                    img.getBoundingClientRect();


                const tableRect =
                    table.getBoundingClientRect();



                /*
                 * Calculate the current center
                 * of the image.
                 */

                const centerX =

                    imageRect.left +
                    imageRect.width / 2;


                const centerY =

                    imageRect.top +
                    imageRect.height / 2;



                /*
                 * Remember exactly where the user
                 * grabbed the object.

                 * This prevents the object from
                 * jumping when dragging begins.
                 */

                offsetX =

                    event.clientX -
                    centerX;


                offsetY =

                    event.clientY -
                    centerY;

            }

        );



        /* =====================================================
           POINTER MOVE
           ===================================================== */

        img.addEventListener(

            "pointermove",

            function(event) {


                if (!dragging) return;


                event.preventDefault();



                const tableRect =
                    table.getBoundingClientRect();



                /*
                 * Calculate where the CENTER of the
                 * image should move.
                 */

                let x =

                    event.clientX -
                    tableRect.left -
                    offsetX;


                let y =

                    event.clientY -
                    tableRect.top -
                    offsetY;



                /*
                 * Keep the entire image inside
                 * the visible room.
                 */

                const constrained =

                    constrainPosition(

                        x,
                        y,
                        img

                    );



                x =
                    constrained.x;


                y =
                    constrained.y;



                /*
                 * Move image.
                 */

                img.style.left =
                    x + "px";


                img.style.top =
                    y + "px";

            }

        );



        /* =====================================================
           POINTER UP
           ===================================================== */

        img.addEventListener(

            "pointerup",

            function(event) {


                dragging = false;


                img.classList.remove(
                    "dragging"
                );



                if (

                    img.hasPointerCapture(
                        event.pointerId
                    )

                ) {

                    img.releasePointerCapture(
                        event.pointerId
                    );

                }

            }

        );



        /* =====================================================
           POINTER CANCEL
           ===================================================== */

        img.addEventListener(

            "pointercancel",

            function(event) {


                dragging = false;


                img.classList.remove(
                    "dragging"
                );



                if (

                    img.hasPointerCapture(
                        event.pointerId
                    )

                ) {

                    img.releasePointerCapture(
                        event.pointerId
                    );

                }

            }

        );



        /* =====================================================
           ADD TO ROOM
           ===================================================== */

        table.appendChild(img);

    });



    /* =========================================================
       HANDLE SCREEN RESIZING
       =========================================================

       We do NOT reload the page.

       Instead, we recalculate the size and position of
       every object.

       ========================================================= */

    function updateObjectsForScreen() {


        objects.forEach(function(item, index) {


            /*
             * Find the corresponding image.
             */

            const img =
                table.querySelector(

                    '[data-index="' +
                    index +
                    '"]'

                );



            if (!img) return;



            /*
             * Change size for the current device.
             */

            img.style.width =
                getObjectSize(item) + "px";



            /*
             * Recalculate starting position.

             */

            const position =
                getPosition(item);



            /*
             * Keep the object inside the new screen.
             */

            const constrained =

                constrainPosition(

                    position.x,
                    position.y,
                    img

                );



            img.style.left =
                constrained.x + "px";


            img.style.top =
                constrained.y + "px";

        });

    }



    /* =========================================================
       RESIZE EVENT
       ========================================================= */

    let resizeTimer;


    window.addEventListener(

        "resize",

        function() {


            clearTimeout(resizeTimer);


            resizeTimer = setTimeout(

                function() {

                    updateObjectsForScreen();

                },

                100

            );

        }

    );


    </script>

</body>

</html>
