<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>digital altar</title>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icon.png" type="image/png">
<link rel="apple-touch-icon" href="images/icon.png">

<style>
/* =========================================================
   BASIC PAGE
   ========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  font-family: monospace;
  color: fuchsia;
  background-color: #02010f;

  overflow: hidden;

  /*
    No padding here.

    The draggable area goes all the way to the edges
    of the actual browser viewport.
  */
  padding: 0;

  /*
    Prevent the phone from trying to scroll or zoom
    while dragging objects.
  */
  touch-action: none;
}


/* =========================================================
   DRAGGABLE ROOM / ALTAR SPACE
   ========================================================= */

#table {
  position: fixed;

  /*
    THIS is the important part.

    The coordinate space is the entire actual screen,
    rather than a 1600x1000 "room" scaled into the screen.
  */
  inset: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  margin: 0;

  touch-action: none;
}


/* =========================================================
   OBJECTS
   ========================================================= */

.object {
  position: absolute;

  height: auto;

  /*
    The x/y coordinates represent the CENTER of the image.
  */
  transform: translate(-50%, -50%);

  /*
    Prevent selecting the image while dragging.
  */
  user-select: none;
  -webkit-user-select: none;

  /*
    Important for iPhone/iPad dragging.
  */
  touch-action: none;

  /*
    Prevent the browser's native image dragging.
  */
  -webkit-user-drag: none;

  cursor: grab;

  display: block;
}

.object.dragging {
  cursor: grabbing;
}


/* =========================================================
   OPTIONAL: KEEP THE CONTENT BELOW THE PHONE NOTCH AREA
   =========================================================

   The room itself still fills the whole screen.

   safe-area-inset values simply give you variables you
   can use later if you decide you want to avoid the notch.
   ========================================================= */

:root {
  --safe-top: env(safe-area-inset-top);
  --safe-right: env(safe-area-inset-right);
  --safe-bottom: env(safe-area-inset-bottom);
  --safe-left: env(safe-area-inset-left);
}
</style>
</head>


<body>

<main id="table"></main>


<script>

/* =========================================================
   OBJECTS
   =========================================================

   THIS is the main place you will edit.

   image:
     The file in your images folder.

   desktopSize:
     Width of the image on desktop.

   mobileSize:
     Width of the image on phones/tablets.

   x:
     Starting horizontal position as a percentage
     of the ACTUAL screen width.

   y:
     Starting vertical position as a percentage
     of the ACTUAL screen height.

   Examples:

     x: 50
     = middle of the screen

     x: 20
     = 20% from the left

     y: 80
     = 80% down the screen

   ========================================================= */

const objects = [

     {
    image: "images/candle_2.GIF",

    desktopSize: 100,
    mobileSize: 30,

    x: 10,
    y: 50
  },

  {
    image: "images/buddha.png",

    desktopSize: 100,
    mobileSize: 30,

    x: 20,
    y: 50
  },

  {
    image: "images/yukimi_frame.png",

    desktopSize: 220,
    mobileSize: 50,

    x: 40,
    y: 50
  },

  {
    image: "images/yogananda_1.png",

    desktopSize: 200,
    mobileSize: 50,

    x: 60,
    y: 50
  },

  {
    image: "images/ganesha.jpg",

    desktopSize: 100,
    mobileSize: 70,

    x: 80,
    y: 50
  }

];


/* =========================================================
   SETUP
   ========================================================= */

const table = document.getElementById("table");

let highestZIndex = 1;


/* =========================================================
   MOBILE DETECTION
   =========================================================

   768px is only the breakpoint.

   The actual coordinate space is ALWAYS the full
   #table, which is the actual viewport.
   ========================================================= */

function isMobile() {
  return window.innerWidth < 768;
}


/* =========================================================
   GET OBJECT SIZE
   ========================================================= */

function getObjectSize(object) {

  if (isMobile()) {
    return object.mobileSize;
  }

  return object.desktopSize;
}


/* =========================================================
   CREATE OBJECTS
   ========================================================= */

objects.forEach(function(objectData, index) {

  const img = document.createElement("img");

  img.src = objectData.image;

  img.classList.add("object");

  img.dataset.index = index;

  /*
    Prevent native browser image dragging.
  */
  img.draggable = false;

  img.addEventListener("dragstart", function(event) {
    event.preventDefault();
  });


  /* -------------------------------------------------------
     IMAGE SIZE
     ------------------------------------------------------- */

  img.style.width = getObjectSize(objectData) + "px";


  /* -------------------------------------------------------
     INITIAL POSITION
     -------------------------------------------------------

     x/y are percentages of the ACTUAL viewport.
     ------------------------------------------------------- */

  img.style.left = objectData.x + "%";
  img.style.top = objectData.y + "%";


  /* -------------------------------------------------------
     Z-INDEX
     ------------------------------------------------------- */

  img.style.zIndex = ++highestZIndex;


  /* =======================================================
     DRAGGING VARIABLES
     ======================================================= */

  let dragging = false;

  let offsetX = 0;
  let offsetY = 0;


  /* =======================================================
     POINTER DOWN
     ======================================================= */

  img.addEventListener("pointerdown", function(event) {

    event.preventDefault();

    dragging = true;

    img.classList.add("dragging");


    /*
      Bring the selected object to the front.
    */
    highestZIndex++;

    img.style.zIndex = highestZIndex;


    /*
      Keep receiving pointer events even if the
      finger/mouse moves outside the image itself.
    */
    img.setPointerCapture(event.pointerId);


    /*
      Find the image's actual position on screen.

      Because the image is centered with:
        transform: translate(-50%, -50%)

      we calculate the offset from its CENTER.
    */

    const imageRect = img.getBoundingClientRect();

    const imageCenterX =
      imageRect.left + imageRect.width / 2;

    const imageCenterY =
      imageRect.top + imageRect.height / 2;


    offsetX = event.clientX - imageCenterX;
    offsetY = event.clientY - imageCenterY;

  });


  /* =======================================================
     POINTER MOVE
     ======================================================= */

  img.addEventListener("pointermove", function(event) {

    if (!dragging) {
      return;
    }

    event.preventDefault();


    const tableRect = table.getBoundingClientRect();

    const imageRect = img.getBoundingClientRect();


    /*
      Calculate where the CENTER of the image should go.
    */

    let x =
      event.clientX
      - tableRect.left
      - offsetX;

    let y =
      event.clientY
      - tableRect.top
      - offsetY;


    /*
      Half the image dimensions.

      We use these to make sure the entire image
      stays inside the screen.
    */

    const halfWidth =
      imageRect.width / 2;

    const halfHeight =
      imageRect.height / 2;


    /* -----------------------------------------------------
       KEEP IMAGE INSIDE LEFT / RIGHT
       ----------------------------------------------------- */

    x = Math.max(
      halfWidth,
      Math.min(
        tableRect.width - halfWidth,
        x
      )
    );


    /* -----------------------------------------------------
       KEEP IMAGE INSIDE TOP / BOTTOM
       ----------------------------------------------------- */

    y = Math.max(
      halfHeight,
      Math.min(
        tableRect.height - halfHeight,
        y
      )
    );


    /* -----------------------------------------------------
       APPLY POSITION
       ----------------------------------------------------- */

    img.style.left = x + "px";
    img.style.top = y + "px";

  });


  /* =======================================================
     POINTER UP
     ======================================================= */

  img.addEventListener("pointerup", function(event) {

    dragging = false;

    img.classList.remove("dragging");


    if (img.hasPointerCapture(event.pointerId)) {
      img.releasePointerCapture(event.pointerId);
    }

  });


  /* =======================================================
     POINTER CANCEL
     ======================================================= */

  img.addEventListener("pointercancel", function(event) {

    dragging = false;

    img.classList.remove("dragging");


    if (img.hasPointerCapture(event.pointerId)) {
      img.releasePointerCapture(event.pointerId);
    }

  });


  /* -------------------------------------------------------
     ADD IMAGE TO ROOM
     ------------------------------------------------------- */

  table.appendChild(img);

});


/* =========================================================
   HANDLE SCREEN SIZE CHANGES
   =========================================================

   This is especially useful when:

   - rotating a phone
   - resizing a desktop browser
   - opening/closing mobile browser UI
   - switching between portrait and landscape

   We DO NOT reload the page.

   We simply change the image sizes when crossing
   the desktop/mobile breakpoint and make sure the
   objects remain inside the visible screen.
   ========================================================= */

let previousMobileState = isMobile();


function updateForScreenSize() {

  const currentMobileState = isMobile();

  const screenChanged =
    currentMobileState !== previousMobileState;


  const tableRect = table.getBoundingClientRect();


  document.querySelectorAll(".object").forEach(function(img) {

    const index = Number(img.dataset.index);

    const objectData = objects[index];


    /*
      If we crossed the 768px breakpoint,
      switch to the appropriate image size.
    */

    if (screenChanged) {

      img.style.width =
        getObjectSize(objectData) + "px";

    }


    /*
      Make sure the object still fits inside
      the new screen dimensions.
    */

    const imageRect = img.getBoundingClientRect();

    let x = parseFloat(img.style.left);
    let y = parseFloat(img.style.top);


    /*
      If the position is still a percentage,
      convert it to pixels.
    */

    if (img.style.left.includes("%")) {

      x =
        tableRect.width *
        parseFloat(img.style.left) /
        100;

    }

    if (img.style.top.includes("%")) {

      y =
        tableRect.height *
        parseFloat(img.style.top) /
        100;

    }


    const halfWidth =
      imageRect.width / 2;

    const halfHeight =
      imageRect.height / 2;


    x = Math.max(
      halfWidth,
      Math.min(
        tableRect.width - halfWidth,
        x
      )
    );


    y = Math.max(
      halfHeight,
      Math.min(
        tableRect.height - halfHeight,
        y
      )
    );


    img.style.left = x + "px";
    img.style.top = y + "px";

  });


  previousMobileState = currentMobileState;
}


/*
  Use a small delay because mobile browsers can report
  viewport dimensions in stages while rotating.
*/

let resizeTimer;

window.addEventListener("resize", function() {

  clearTimeout(resizeTimer);

  resizeTimer = setTimeout(function() {
    updateForScreenSize();
  }, 100);

});


</script>

</body>
</html>
