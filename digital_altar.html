<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>digital altar</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="images/icon.png">


    <style>

    /* =========================================================
       BASIC PAGE
       ========================================================= */

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        font-family: monospace;
        color: fuchsia;
        background-color: #02010f;
        font-size: 14px;

        /*
         * Space around the invisible table.
         */
        padding: 10px;

        /*
         * Prevent the browser from trying to scroll the page
         * while an object is being dragged.
         */
        overflow: hidden;
    }

    a {
        color: rgb(105, 255, 150);
        text-decoration: none;
    }


    /* =========================================================
       THE INVISIBLE TABLE
       ========================================================= */

    #table {
        /*
         * This is the invisible surface that the objects
         * are resting on.
         *
         * You can give this a background temporarily while
         * designing if you want to see it.
         */

        position: relative;

        width: min(1200px, 100%);
        height: calc(100vh - 20px);

        margin: 0 auto;

        /*
         * Uncomment this temporarily to see the table:

         background: rgba(255, 0, 255, 0.05);
         border: 1px dashed fuchsia;
         */

        overflow: hidden;
    }


    /* =========================================================
       DRAGGABLE OBJECTS
       ========================================================= */

    .object {
        position: absolute;

        /*
         * Width is supplied by JavaScript from the image
         * configuration below.
         */
        height: auto;

        user-select: none;
        -webkit-user-select: none;

        /*
         * Allows dragging with a finger on mobile without
         * the browser interpreting it as page scrolling.
         */
        touch-action: none;

        cursor: grab;

        /*
         * Prevents the image from being selected/dragged
         * as a normal browser image.
         */
        -webkit-user-drag: none;

        transform: translate(-50%, -50%);
    }

    .object.dragging {
        cursor: grabbing;

        /*
         * Makes the currently selected object appear above
         * everything else.
         */
        z-index: 9999;
    }


    /* =========================================================
       DESKTOP
       ========================================================= */

    @media (min-width: 768px) {

        body {
            padding: 15px;
        }

        #table {
            /*
             * More vertical breathing room on desktop.
             */
            height: calc(100vh - 30px);
        }

        .object {
            /*
             * Optional desktop styling.
             *
             * Actual image sizes are controlled in the
             * IMAGE CONFIGURATION section below.
             */
        }
    }


    /* =========================================================
       PHONE
       ========================================================= */

    @media (max-width: 767px) {

        body {
            padding: 10px;
        }

        #table {
            /*
             * Keeps the workspace centered vertically.
             */
            height: calc(100vh - 20px);
        }

        .object {
            /*
             * Mobile-specific styling can go here if needed.
             *
             * Individual image sizes are controlled by the
             * mobileWidth values in the configuration.
             */
        }
    }

    </style>
</head>


<body>

    <!-- =======================================================
         INVISIBLE TABLE
         ======================================================= -->

    <main id="table"></main>


    ```html
<script>

    /* =========================================================
       IMAGE CONFIGURATION
       =========================================================

       THIS IS THE MAIN SECTION YOU WILL EDIT.

       width:
           Desktop image width in pixels.

       mobileWidth:
           Phone image width in pixels.

       x / y:
           Starting desktop position, as percentages.

       mobileX / mobileY:
           Starting phone position, as percentages.

       ========================================================= */

    const images = [

        {
            src: "images/buddha.png",

            width: 220,
            mobileWidth: 120,

            x: 30,
            y: 40,

            mobileX: 35,
            mobileY: 35
        },

        {
            src: "images/ganesha.jpg",

            width: 180,
            mobileWidth: 100,

            x: 55,
            y: 35,

            mobileX: 65,
            mobileY: 35
        },

        {
            src: "images/guadalupe.jpg",

            width: 260,
            mobileWidth: 140,

            x: 70,
            y: 60,

            mobileX: 50,
            mobileY: 60
        },

        {
            src: "images/yukimi_3.jpg",

            width: 100,
            mobileWidth: 170,

            x: 35,
            y: 70,

            mobileX: 45,
            mobileY: 75
        }

    ];


    /* =========================================================
       TABLE
       ========================================================= */

    const table = document.getElementById("table");

    /*
     * Every time an image is selected, this number increases.
     * This guarantees that the selected image goes to the front.
     */
    let highestZIndex = 1;


    /* =========================================================
       CREATE IMAGES
       ========================================================= */

    images.forEach((item, index) => {

        const img = document.createElement("img");

        img.src = item.src;

        img.classList.add("object");

        img.dataset.index = index;

        /*
         * IMPORTANT:
         * Prevent the browser from using its own native
         * image-dragging behavior on desktop.
         */
        img.draggable = false;

        img.addEventListener("dragstart", function(event) {
            event.preventDefault();
        });


        /* -----------------------------------------------------
           DESKTOP SIZE
           ----------------------------------------------------- */

        img.style.width = item.width + "px";


        /* -----------------------------------------------------
           STARTING DESKTOP POSITION
           ----------------------------------------------------- */

        img.style.left = item.x + "%";
        img.style.top = item.y + "%";


        /* -----------------------------------------------------
           MOBILE SIZE + POSITION
           ----------------------------------------------------- */

        if (item.mobileWidth) {

            const mobileStyle = document.createElement("style");

            mobileStyle.innerHTML = `
                @media (max-width: 767px) {

                    .object[data-index="${index}"] {
                        width: ${item.mobileWidth}px;
                        left: ${item.mobileX}%;
                        top: ${item.mobileY}%;
                    }

                }
            `;

            document.head.appendChild(mobileStyle);
        }


        /* =====================================================
           DRAGGING
           ===================================================== */

        let dragging = false;

        let offsetX = 0;
        let offsetY = 0;


        /* -----------------------------------------------------
           POINTER DOWN
           ----------------------------------------------------- */

        img.addEventListener("pointerdown", function(event) {

            /*
             * Stop the browser from doing anything else with
             * this mouse/finger action.
             */
            event.preventDefault();

            dragging = true;

            img.classList.add("dragging");


            /*
             * Bring THIS image to the absolute front.
             */
            highestZIndex++;

            img.style.zIndex = highestZIndex;


            /*
             * Capture the pointer.
             *
             * This is important on desktop because it means
             * the image continues receiving mouse movement even
             * if the cursor moves quickly.
             */
            img.setPointerCapture(event.pointerId);


            const rect = table.getBoundingClientRect();
            const imageRect = img.getBoundingClientRect();


            /*
             * Remember exactly where the image was grabbed.
             *
             * This prevents the image from "jumping" when
             * dragging begins.
             */
            offsetX =
                event.clientX -
                (imageRect.left + imageRect.width / 2);

            offsetY =
                event.clientY -
                (imageRect.top + imageRect.height / 2);
        });


        /* -----------------------------------------------------
           POINTER MOVE
           ----------------------------------------------------- */

        img.addEventListener("pointermove", function(event) {

            if (!dragging) return;

            event.preventDefault();


            const rect = table.getBoundingClientRect();

            const imageRect = img.getBoundingClientRect();


            /*
             * Find the mouse/finger position relative
             * to the invisible table.
             */
            let x =
                event.clientX -
                rect.left -
                offsetX;

            let y =
                event.clientY -
                rect.top -
                offsetY;


            /*
             * Convert the position into percentages.
             */
            let xPercent =
                (x / rect.width) * 100;

            let yPercent =
                (y / rect.height) * 100;


            /*
             * Calculate half the image dimensions.
             *
             * This prevents the image from being dragged
             * completely off the table.
             */
            const halfWidth =
                (imageRect.width / rect.width) * 50;

            const halfHeight =
                (imageRect.height / rect.height) * 50;


            /*
             * Keep the entire image inside the table.
             */
            xPercent = Math.max(
                halfWidth,
                Math.min(100 - halfWidth, xPercent)
            );

            yPercent = Math.max(
                halfHeight,
                Math.min(100 - halfHeight, yPercent)
            );


            /*
             * Move the image.
             */
            img.style.left = xPercent + "%";
            img.style.top = yPercent + "%";

        });


        /* -----------------------------------------------------
           POINTER UP
           ----------------------------------------------------- */

        img.addEventListener("pointerup", function(event) {

            if (!dragging) return;

            dragging = false;

            img.classList.remove("dragging");

            /*
             * Release the pointer.
             */
            if (img.hasPointerCapture(event.pointerId)) {
                img.releasePointerCapture(event.pointerId);
            }

        });


        /* -----------------------------------------------------
           POINTER CANCEL
           ----------------------------------------------------- */

        img.addEventListener("pointercancel", function(event) {

            dragging = false;

            img.classList.remove("dragging");

            if (img.hasPointerCapture(event.pointerId)) {
                img.releasePointerCapture(event.pointerId);
            }

        });


        /* -----------------------------------------------------
           ADD IMAGE TO TABLE
           ----------------------------------------------------- */

        table.appendChild(img);

    });

</script>
</body>
</html>
