<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>digital altar</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="images/icon.png">


    <style>

    /* =========================================================
       BASIC PAGE
       ========================================================= */

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        font-family: monospace;
        color: fuchsia;
        background-color: #02010f;
        font-size: 14px;

        /*
         * Space around the invisible table.
         */
        padding: 10px;

        /*
         * Prevent the browser from trying to scroll the page
         * while an object is being dragged.
         */
        overflow: hidden;
    }

    a {
        color: rgb(105, 255, 150);
        text-decoration: none;
    }


    /* =========================================================
       THE INVISIBLE TABLE
       ========================================================= */

    #table {
        /*
         * This is the invisible surface that the objects
         * are resting on.
         *
         * You can give this a background temporarily while
         * designing if you want to see it.
         */

        position: relative;

        width: min(1200px, 100%);
        height: calc(100vh - 20px);

        margin: 0 auto;

        /*
         * Uncomment this temporarily to see the table:

         background: rgba(255, 0, 255, 0.05);
         border: 1px dashed fuchsia;
         */

        overflow: hidden;
    }


    /* =========================================================
       DRAGGABLE OBJECTS
       ========================================================= */

    .object {
        position: absolute;

        /*
         * Width is supplied by JavaScript from the image
         * configuration below.
         */
        height: auto;

        user-select: none;
        -webkit-user-select: none;

        /*
         * Allows dragging with a finger on mobile without
         * the browser interpreting it as page scrolling.
         */
        touch-action: none;

        cursor: grab;

        /*
         * Prevents the image from being selected/dragged
         * as a normal browser image.
         */
        -webkit-user-drag: none;

        transform: translate(-50%, -50%);
    }

    .object.dragging {
        cursor: grabbing;

        /*
         * Makes the currently selected object appear above
         * everything else.
         */
        z-index: 9999;
    }


    /* =========================================================
       DESKTOP
       ========================================================= */

    @media (min-width: 768px) {

        body {
            padding: 15px;
        }

        #table {
            /*
             * More vertical breathing room on desktop.
             */
            height: calc(100vh - 30px);
        }

        .object {
            /*
             * Optional desktop styling.
             *
             * Actual image sizes are controlled in the
             * IMAGE CONFIGURATION section below.
             */
        }
    }


    /* =========================================================
       PHONE
       ========================================================= */

    @media (max-width: 767px) {

        body {
            padding: 10px;
        }

        #table {
            /*
             * Keeps the workspace centered vertically.
             */
            height: calc(100vh - 20px);
        }

        .object {
            /*
             * Mobile-specific styling can go here if needed.
             *
             * Individual image sizes are controlled by the
             * mobileWidth values in the configuration.
             */
        }
    }

    </style>
</head>


<body>

    <!-- =======================================================
         INVISIBLE TABLE
         ======================================================= -->

    <main id="table"></main>


    <script>

    /* =========================================================
       IMAGE CONFIGURATION
       =========================================================

       THIS IS THE MAIN SECTION YOU WILL EDIT.

       Each object can have:

       src
           The image file.

       width
           Desktop image width in pixels.

       mobileWidth
           Phone image width in pixels.

       x
           Starting horizontal position.

       y
           Starting vertical position.

       mobileX
           Starting horizontal position on phone.

       mobileY
           Starting vertical position on phone.

       The x/y positions are percentages of the invisible table.

       Example:

           x: 50,
           y: 50

       means the center of the image starts in the middle
       of the table.

       ========================================================= */


    const images = [

        {
            src: "images/buddha.png",

            width: 220,
            mobileWidth: 120,

            x: 30,
            y: 40,

            mobileX: 35,
            mobileY: 35
        },


        {
            src: "images/ganesha.jpg",

            width: 180,
            mobileWidth: 100,

            x: 55,
            y: 35,

            mobileX: 65,
            mobileY: 35
        },


        {
            src: "images/yogananda.jpg",

            width: 260,
            mobileWidth: 140,

            x: 70,
            y: 60,

            mobileX: 50,
            mobileY: 60
        },


        {
            src: "images/yukimi_3.jpg",

            width: 300,
            mobileWidth: 170,

            x: 35,
            y: 70,

            mobileX: 45,
            mobileY: 75
        }

    ];


    /* =========================================================
       TABLE
       ========================================================= */

    const table = document.getElementById("table");


    /* =========================================================
       CREATE IMAGES
       ========================================================= */

    images.forEach((item, index) => {

        const img = document.createElement("img");

        img.src = item.src;

        img.classList.add("object");

        /*
         * Give every object its own ID.
         */
        img.dataset.index = index;


        /* -----------------------------------------------------
           DESKTOP SIZE
           ----------------------------------------------------- */

        img.style.width = item.width + "px";


        /* -----------------------------------------------------
           STARTING POSITION
           ----------------------------------------------------- */

        img.style.left = item.x + "%";
        img.style.top = item.y + "%";


        /* -----------------------------------------------------
           MOBILE SIZE
           ----------------------------------------------------- */

        if (item.mobileWidth) {

            const mobileStyle = document.createElement("style");

            mobileStyle.innerHTML = `
                @media (max-width: 767px) {
                    .object[data-index="${index}"] {
                        width: ${item.mobileWidth}px;
                        left: ${item.mobileX}%;
                        top: ${item.mobileY}%;
                    }
                }
            `;

            document.head.appendChild(mobileStyle);
        }


        /* -----------------------------------------------------
           DRAGGING
           ----------------------------------------------------- */

        let dragging = false;

        let offsetX = 0;
        let offsetY = 0;


        img.addEventListener("pointerdown", function(event) {

            dragging = true;

            img.classList.add("dragging");

            /*
             * Bring this image to the front.
             */
            img.style.zIndex = 9999;

            /*
             * Capture the pointer so dragging continues
             * even if the finger/mouse moves quickly.
             */
            img.setPointerCapture(event.pointerId);


            const rect = table.getBoundingClientRect();
            const imageRect = img.getBoundingClientRect();

            /*
             * Calculate where inside the image the user
             * grabbed it.
             */
            offsetX =
                event.clientX -
                (imageRect.left + imageRect.width / 2);

            offsetY =
                event.clientY -
                (imageRect.top + imageRect.height / 2);
        });


        img.addEventListener("pointermove", function(event) {

            if (!dragging) return;


            const rect = table.getBoundingClientRect();


            /*
             * Convert mouse/finger position into coordinates
             * relative to the invisible table.
             */
            let x =
                event.clientX -
                rect.left -
                offsetX;

            let y =
                event.clientY -
                rect.top -
                offsetY;


            /*
             * Convert to percentage.
             *
             * This means the objects remain responsive if
             * the screen changes size.
             */
            let xPercent =
                (x / rect.width) * 100;

            let yPercent =
                (y / rect.height) * 100;


            /*
             * Keep the object inside the table.
             */
            const halfWidth =
                (imageRectWidth(img) / rect.width) * 50;

            const halfHeight =
                (imageRectHeight(img) / rect.height) * 50;


            xPercent = Math.max(
                halfWidth,
                Math.min(100 - halfWidth, xPercent)
            );

            yPercent = Math.max(
                halfHeight,
                Math.min(100 - halfHeight, yPercent)
            );


            img.style.left = xPercent + "%";
            img.style.top = yPercent + "%";
        });


        img.addEventListener("pointerup", function(event) {

            dragging = false;

            img.classList.remove("dragging");

            img.releasePointerCapture(event.pointerId);
        });


        img.addEventListener("pointercancel", function() {

            dragging = false;

            img.classList.remove("dragging");
        });


        table.appendChild(img);

    });


    /* =========================================================
       HELPER FUNCTIONS
       ========================================================= */

    function imageRectWidth(img) {
        return img.getBoundingClientRect().width;
    }

    function imageRectHeight(img) {
        return img.getBoundingClientRect().height;
    }


    </script>

</body>
</html>
