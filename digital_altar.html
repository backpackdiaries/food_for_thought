<style>

/* ==========================================================
   FOOD FOR THOUGHT — DIGITAL ALTAR V2
   ========================================================== */


* {
    box-sizing: border-box;
}


html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

}


body {

    font-family: monospace;

    color: fuchsia;

    background-color: #02010f;

    font-size: 14px;

    overflow: hidden;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;

}


/* ==========================================================
   FLOATING SPACE
   ========================================================== */


#space {

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

}


/* tiny distant symbols */

.star {

    position: absolute;

    color: rgb(105, 255, 150);

    opacity: 0.45;

    pointer-events: none;

}


/* ==========================================================
   ALTAR WORLD

   The altar has its own coordinate system.

   It remains large and spacious internally,
   while the entire world scales down on small screens.
   ========================================================== */


#altar-world {

    position: absolute;

    width: 1000px;
    height: 720px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(1);

    transform-origin: center center;

}


/* ==========================================================
   THE ALTAR

   One single floating line.
   ========================================================== */


#altar {

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 760px;
    height: 390px;

}


/* ==========================================================
   SINGLE TABLE LINE
   ========================================================== */


.table-line {

    position: absolute;

    left: 50%;
    bottom: 95px;

    transform: translateX(-50%);

    width: 760px;

    height: 1px;

    border-top: 1px solid fuchsia;

    pointer-events: none;

}


.table-line::before {

    content: "·";

    position: absolute;

    left: -8px;
    top: -7px;

    color: rgb(105, 255, 150);

}


.table-line::after {

    content: "·";

    position: absolute;

    right: -8px;
    top: -7px;

    color: rgb(105, 255, 150);

}


/* ==========================================================
   SMALL DECORATIONS AROUND THE TABLE
   ========================================================== */


.table-mark {

    position: absolute;

    color: rgb(105, 255, 150);

    opacity: 0.65;

    pointer-events: none;

}


.table-mark.left {

    left: 115px;
    bottom: 89px;

}


.table-mark.right {

    right: 115px;
    bottom: 89px;

}


/* ==========================================================
   OBJECTS
   ========================================================== */


.object {

    position: absolute;

    cursor: grab;

    transform-origin: center bottom;

    touch-action: none;

    z-index: 10;

}


.object:active {

    cursor: grabbing;

}


.object:hover {

    filter: brightness(1.18);

}


/* ==========================================================
   PHOTOGRAPHS

   The frame determines the size.

   The uploaded image does NOT determine the frame shape.
   ========================================================== */


.photo {

    position: absolute;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 8px;

    background: #02010f;

    border: 1px solid fuchsia;

    box-shadow:
        3px 3px 0 rgba(255, 0, 255, 0.25);

    overflow: hidden;

}


/* small portrait */

.photo.small-portrait {

    width: 92px;
    height: 125px;

}


/* medium portrait */

.photo.medium-portrait {

    width: 125px;
    height: 170px;

}


/* landscape */

.photo.landscape {

    width: 165px;
    height: 115px;

}


/* large portrait */

.photo.large-portrait {

    width: 150px;
    height: 200px;

}


/* image itself */

.photo img {

    width: 100%;
    height: 100%;

    object-fit: contain;

    pointer-events: none;

}


/* ==========================================================
   CANDLES
   ========================================================== */


.candle {

    position: absolute;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-start;

}


/* ----------------------------------------------------------
   FLAME
   ---------------------------------------------------------- */


.flame {

    width: 30px;
    height: 32px;

    line-height: 32px;

    text-align: center;

    color: rgb(255, 170, 255);

    animation:
        flicker 0.8s infinite steps(2);

}


/* alternate flame animation speeds */

.candle.slow .flame {

    animation-duration: 1.25s;

}


.candle.fast .flame {

    animation-duration: 0.55s;

}


/* ----------------------------------------------------------
   WAX
   ---------------------------------------------------------- */


.wax {

    position: relative;

    background: #02010f;

    border-left: 1px solid fuchsia;
    border-right: 1px solid fuchsia;

}


/* subtle green wick */

.wax::before {

    content: "";

    position: absolute;

    top: -4px;
    left: 50%;

    width: 1px;
    height: 6px;

    transform: translateX(-50%);

    background: rgb(105, 255, 150);

}


/* ----------------------------------------------------------
   CANDLE BASE
   ---------------------------------------------------------- */


.base {

    color: fuchsia;

    white-space: nowrap;

    line-height: 10px;

}


/* ==========================================================
   PILLAR CANDLES
   ========================================================== */


.pillar .wax {

    width: 44px;
    height: 65px;

}


.pillar.short .wax {

    height: 45px;

}


.pillar.tall .wax {

    height: 105px;

}


/* ==========================================================
   TALL THIN CANDLE
   ========================================================== */


.skinny .wax {

    width: 12px;
    height: 135px;

}


/* ==========================================================
   LOTUS CANDLE
   ========================================================== */


.lotus {

    width: 90px;

}


.lotus-flower {

    width: 80px;
    height: 50px;

    text-align: center;

    line-height: 50px;

    color: rgb(255, 105, 255);

    font-size: 30px;

}


/* ==========================================================
   CANDLE FLICKER
   ========================================================== */


@keyframes flicker {

    0% {

        transform:
            translateX(-1px)
            scale(0.95)
            rotate(-3deg);

        opacity: 0.72;

    }

    20% {

        transform:
            translateX(1px)
            scale(1.08)
            rotate(2deg);

        opacity: 1;

    }

    45% {

        transform:
            translateX(-2px)
            scale(0.88)
            rotate(-1deg);

        opacity: 0.68;

    }

    70% {

        transform:
            translateX(2px)
            scale(1.12)
            rotate(4deg);

        opacity: 1;

    }

    100% {

        transform:
            translateX(-1px)
            scale(0.95)
            rotate(-3deg);

        opacity: 0.72;

    }

}


/* ==========================================================
   OTHER ALTAR OBJECTS
   ========================================================== */


.flower {

    font-size: 35px;

    color: rgb(255, 105, 255);

}


.flower.small {

    font-size: 25px;

}


.stone {

    font-size: 27px;

    color: rgb(105, 255, 150);

}


.incense {

    font-size: 27px;

    color: fuchsia;

}


.symbol {

    font-size: 30px;

    color: rgb(105, 255, 150);

}


/* ==========================================================
   VERY SUBTLE FLOATING MOTION

   Only the altar world moves, not individual objects.
   ========================================================== */


#altar-world {

    animation:

        breathe 8s ease-in-out infinite;

}


@keyframes breathe {

    0% {

        margin-top: 0px;

    }

    50% {

        margin-top: -3px;

    }

    100% {

        margin-top: 0px;

    }

}


/* ==========================================================
   RESPONSIVE SCALING
   ========================================================== */


/*
   Desktop:
   The altar remains relatively small compared to
   the surrounding space.
*/


@media (min-width: 901px) {

    #altar-world {

        transform:
            translate(-50%, -50%)
            scale(1);

    }

}


/*
   Tablet and smaller screens:
   Scale the entire altar proportionally.
*/


@media (max-width: 900px) {

    #altar-world {

        transform:
            translate(-50%, -50%)
            scale(
                min(
                    calc(100vw / 1080),
                    calc(100vh / 790)
                )
            );

    }

}


/*
   Phone:
   Give the altar a little more vertical breathing room.

   The important difference from V1 is that we're NOT
   shrinking the objects individually.
*/


@media (max-width: 600px) {

    #altar-world {

        width: 1000px;
        height: 780px;

        transform:
            translate(-50%, -50%)
            scale(
                min(
                    calc(100vw / 1050),
                    calc(100vh / 820)
                )
            );

    }


    .photo {

        box-shadow:
            2px 2px 0 rgba(255, 0, 255, 0.25);

    }

}


/*
   Very short phone screens.
*/


@media (
    max-width: 600px
)
and (
    max-height: 650px
) {

    #altar-world {

        transform:
            translate(-50%, -50%)
            scale(
                min(
                    calc(100vw / 1080),
                    calc(100vh / 720)
                )
            );

    }

}


/*
   Landscape phones.
*/


@media (
    orientation: landscape
)
and (
    max-height: 600px
) {

    #altar-world {

        transform:
            translate(-50%, -50%)
            scale(
                min(
                    calc(100vw / 1080),
                    calc(100vh / 720)
                )
            );

    }

}

<script>


/* ==========================================================
   DRAGGING
   ========================================================== */


const objects =
    document.querySelectorAll("[data-draggable]");


let highestZ = 20;


objects.forEach(object => {


    let dragging = false;

    let startX = 0;
    let startY = 0;

    let originalLeft = 0;
    let originalTop = 0;


    object.addEventListener(
        "pointerdown",
        startDrag
    );


    function startDrag(event) {


        dragging = true;


        object.setPointerCapture(
            event.pointerId
        );


        startX = event.clientX;
        startY = event.clientY;


        originalLeft =
            parseFloat(object.style.left) || 0;


        originalTop =
            parseFloat(object.style.top) || 0;


        highestZ++;

        object.style.zIndex =
            highestZ;


        event.preventDefault();

    }


    object.addEventListener(
        "pointermove",
        drag
    );


    function drag(event) {


        if (!dragging) return;


        const altarWorld =
            document.getElementById(
                "altar-world"
            );


        const matrix =
            new DOMMatrix(
                getComputedStyle(
                    altarWorld
                ).transform
            );


        let scale = matrix.a;


        if (!scale || scale === 0) {

            scale = 1;

        }


        const dx =
            (event.clientX - startX)
            / scale;


        const dy =
            (event.clientY - startY)
            / scale;


        object.style.left =
            (originalLeft + dx) + "px";


        object.style.top =
            (originalTop + dy) + "px";


    }


    object.addEventListener(
        "pointerup",
        stopDrag
    );


    object.addEventListener(
        "pointercancel",
        stopDrag
    );


    function stopDrag() {

        dragging = false;

    }


});
