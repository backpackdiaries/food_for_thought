<!DOCTYPE html>
<html>
<head>
    <title>private</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="images/icon.png">

    <style>
        body {
            font-family: monospace;
            color: fuchsia;
            background-color: #02010f;
            font-size: 14px;
            margin: 0;
            min-height: 100vh;
        }

        a {
            color: rgb(105, 255, 150);
            text-decoration: none;
        }

        a:hover {
            color: fuchsia;
        }

        a:active {
            color: fuchsia;
        }

        .home-button {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 16px;
        }

        .password-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
        }

        .password-form {
            margin: 0;
            padding: 0;
        }

        .password-input {
            box-sizing: border-box;
            background: #02010f;
            color: rgb(105, 255, 150);
            border: 1px solid fuchsia;
            border-radius: 5px;
            padding: 6px 8px;
            font-family: monospace;
            font-size: 16px;
            outline: none;
            width: 180px;
            -webkit-appearance: none;
            appearance: none;
        }

        .password-input:focus {
            border-color: rgb(105, 255, 150);
        }

        .enter-button {
            margin-left: 5px;
            background: transparent;
            color: rgb(105, 255, 150);
            border: 1px solid fuchsia;
            border-radius: 5px;
            padding: 6px 10px;
            font-family: monospace;
            font-size: 13px;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .enter-button:hover {
            color: fuchsia;
        }

        .error {
            margin-top: 12px;
            min-height: 14px;
            font-size: 12px;
        }
    </style>
</head>

<body>

<a class="home-button" href="food_for_thought.html">╾━╤デ╦︻</a>

<div class="password-container">

    <div>
        enter password:
    </div>

    <br>

    <form class="password-form" id="password-form">
        <input
            type="password"
            id="password"
            class="password-input"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
        >

        <button type="submit" class="enter-button">enter</button>

        <div class="error" id="error"></div>
    </form>

</div>

<script>
    document.getElementById("password-form").addEventListener("submit", function(event) {
        event.preventDefault();

        const password = document.getElementById("password").value;
        const error = document.getElementById("error");

        if (password === "pastlife") {
            window.location.href = "secret_page.html";
        } else {
            error.textContent = "wrong password...";
        }
    });
</script>

</body>
</html>
