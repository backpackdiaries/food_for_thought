<!DOCTYPE html>
<html>
<head>

    <title>pants</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="images/icon.png">

<style>

body {
    font-family: monospace;
    color: fuchsia;
    background-color: #02010f;
    font-size: 14px;
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
}

a {
    color: rgb(105, 255, 150);
    text-decoration: none;
}

a:hover {
    color: fuchsia;
}

a:active {
    color: fuchsia;
}


/* BACK BUTTON */

.home-button {
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 16px;
    z-index: 10;
}


/* CAROUSEL */

.carousel {
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    box-sizing: border-box;
    padding: 70px 20px;
}

.carousel-frame {
    width: 70vw;
    max-width: 600px;
    height: 65vh;

    display: flex;
    justify-content: center;
    align-items: center;
}

.carousel-image {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;

    border-radius: 8px;
}


/* BUTTON */

.next-button {
    margin-top: 15px;

    color: rgb(105, 255, 150);
    background: transparent;

    border: 1px solid fuchsia;
    border-radius: 5px;

    padding: 4px 9px;

    font-family: monospace;
    font-size: 11px;

    cursor: pointer;
}

.next-button:hover {
    color: fuchsia;
}


/* DESCRIPTION */

.description {
    max-width: 500px;

    margin-top: 20px;

    font-size: 11px;
    line-height: 1.5;

    text-align: center;
}


/* PHONE */

@media (max-width: 768px) {

    .carousel {
        padding: 70px 15px;
    }

    .carousel-frame {
        width: 90vw;
        height: 60vh;
    }

    .description {
        max-width: 90%;
        font-size: 11px;
    }

}

</style>
</head>


<body>


<a class="home-button" href="food_for_thought.html">
    ╾━╤デ╦︻
</a>


<div class="carousel">


    <div class="carousel-frame">

        <img
            id="carousel-image"
            class="carousel-image"
            src="images/photo_1.jpg"
            alt="project image"
        >

    </div>


    <button class="next-button" onclick="nextImage()">
        ⟶
    </button>


    <div class="description">
PANTS!!!!!! made with cyanotype on cotton fabric
        <br>
         © 

    </div>


</div>


<script>

const images = [
    "images/pants_1.jpeg",
    "images/pants_2.jpeg"
];

let currentImage = 0;


function nextImage() {

    currentImage = (currentImage + 1) % images.length;

    document.getElementById("carousel-image").src =
        images[currentImage];

}


/* AUTO ROTATE */

setInterval(function() {

    nextImage();

}, 4000);

</script>


</body>
</html>
