<!DOCTYPE html>
<html lang="en">

<head>
    <title>𝓐𝓶𝓮𝓻𝓲𝓬𝓪</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="images/icon.png">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            background-color: #02010f;
        }

        body {
            font-family: monospace;
            color: fuchsia;
            background-color: #02010f;
            font-size: 14px;
            margin: 0;
            overflow-x: hidden;
        }

        /* LINKS */

        a {
            color: rgb(105, 255, 150);
            text-decoration: none;
        }

        a:hover,
        a:active {
            color: fuchsia;
        }

        /* BACK BUTTON */

        .home-button {
            position: fixed;
            top: 15px;
            left: 15px;
            font-size: 16px;
            z-index: 10;
        }

        /* INTRODUCTION */

        .introduction {
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 80px 20px;
        }

        .intro-text {
            max-width: 550px;
            text-align: center;
            font-size: 13px;
            line-height: 1.6;
        }

        /* FIRST THREE IMAGE PAGES */

        .project-page {
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 0;
        }

        .project-page img {
            display: block;

            width: 40%;
            height: auto;
            max-height: 85vh;

            object-fit: contain;
            margin: 0;
            padding: 0;
        }

        /* SPACE BEFORE FINAL LOOK */

        .final-transition {
            height: 12vh;
        }

        /* FINAL THREE IMAGES */

        .final-images {
            width: 55%;
            max-width: 600px;

            margin: 0 auto;

            line-height: 0;
        }

        .final-images img {
            display: block;

            width: 100%;
            height: auto;

            margin: 0;
            padding: 0;
        }

        /* CONCLUSION */

        .conclusion {
            max-width: 550px;

            margin: 50px auto 100px;
            padding: 0 20px;

            text-align: center;

            font-size: 11px;
            line-height: 1.5;
        }

        /* MOBILE */

        @media (max-width: 768px) {

            .introduction {
                min-height: 100svh;
                padding: 70px 20px;
            }

            .intro-text {
                max-width: 90%;
                font-size: 12px;
            }

            /* EACH IMAGE GETS ITS OWN SCREEN */

            .project-page {
                min-height: 100svh;

                padding: 50px 0;

                display: flex;
                justify-content: center;
                align-items: center;
            }

            .project-page img {
                width: 60%;
                max-height: 80svh;
                height: auto;
                object-fit: contain;
            }

            /* SPACE BEFORE FINAL LOOK */

            .final-transition {
                height: 8vh;
            }

            /* FINAL THREE IMAGES */

            .final-images {
                width: 90%;
                max-width: none;
                margin: 0 auto;
            }

            .conclusion {
                max-width: 90%;
                margin: 40px auto 80px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <!-- BACK BUTTON -->

    <a class="home-button" href="food_for_thought.html">╾━╤デ╦︻</a>


    <!-- INTRODUCTION -->

    <section class="introduction">

        <div class="intro-text">
            A graphic study on American symbolism, propoganda, and identity.
            <br><br>
            ↓
        </div>

    </section>


    <!-- FIRST IMAGE PAGE -->

    <section class="project-page">

        <img
            src="images/america_1_2.jpeg"
            alt="Thesis image"
        >

    </section>


    <!-- SECOND IMAGE PAGE -->

    <section class="project-page">

        <img
            src="images/america_4.jpg"
            alt="Project image"
        >

    </section>


    <!-- THIRD IMAGE PAGE -->

    <section class="project-page">

        <img
            src="images/america_SECOND_IMAGE.jpg"
            alt="Project image"
        >

    </section>


    <!-- BREATHING SPACE BEFORE FINAL LOOK -->

    <div class="final-transition"></div>


    <!-- FINAL THREE IMAGES -->

    <section class="final-images">

        <img src="images/america_5.jpeg" alt="Garment">
        <img src="images/america_6.jpeg" alt="Garment">
        <img src="images/america_7.jpeg" alt="Garment">

    </section>


    <!-- CONCLUSION -->

    <div class="conclusion">

        <br><br>
        ☯
        <br><br><br><br><br>

    </div>

</body>
</html>
