<!DOCTYPE html>
<html>

<head>
    <title>music</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="images/icon.png">
</head>


<style>

body {
    font-family: monospace;
    color: fuchsia;
    background-color: #02010f;
    font-size: 14px;
    margin: 0;
    min-height: 100vh;
}


/* LINKS */

a {
    color: rgb(105, 255, 150);
    text-decoration: none;
}

a:hover {
    color: fuchsia;
}

a:active {
    color: fuchsia;
}


/* BACK BUTTON */

.home-button {
    position: absolute;
    top: 15px;
    left: 15px;
    font-size: 16px;
}


/* CENTER CONTENT */

.center-content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    text-align: center;
    width: 90%;
}


/* IMAGE */

.center-image {
    display: block;
    width: auto;
    max-width: 80%;
    max-height: 55vh;
    height: auto;
    margin: 0 auto 20px auto;
}


/* AUDIO PLAYER */

.audio-player {
    width: 300px;
    max-width: 90%;
}


/* PHONE */

@media (max-width: 768px) {

    .center-image {
        max-width: 85%;
        max-height: 50vh;
        margin-bottom: 15px;
    }

    .audio-player {
        width: 280px;
    }

}

</style>


<body>


    <!-- BACK BUTTON -->

    <a class="home-button" href="index.html">╾━╤デ╦︻</a>


    <!-- CENTERED IMAGE + AUDIO -->

    <div class="center-content">

        <img
            class="center-image"
            src="images/your_image.jpg"
            alt="">

        <audio
            class="audio-player"
            controls>

            <source src="audio/Snowbird_1.wav" type="audio/mpeg">

        </audio>

    </div>


</body>
</html>
