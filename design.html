<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>𝔭𝔯𝔬𝔧𝔢𝔠𝔱𝔰</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="images/icon.png">

    <style>
        /* GLOBAL */

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background-color: #02010f;
        }

        body {
            font-family: monospace;
            font-size: 14px;
            color: fuchsia;
            background-color: #02010f;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        /* LINKS */

        a {
            color: rgb(105, 255, 150);
            text-decoration: none;
        }

        a:hover,
        a:active {
            color: fuchsia;
        }

        /* HOME BUTTON */

        .home-button {
            display: inline-block;
            margin-bottom: 35px;
        }

        /* PAGE TITLE */

        .page-title {
            text-align: center;
            font-size: 13px;
            font-weight: normal;
            margin: 20px 0 50px;
        }

        /* IMAGE BUTTON GRID */

        .button-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            column-gap: 25px;
            row-gap: 45px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* INDIVIDUAL IMAGE BUTTON */

        .image-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 8px;
        }

        .image-button img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
            transform: rotate(0deg);
            animation: icon-rock 2.4s ease-in-out infinite;
            transition: opacity 0.2s ease;
            transform-origin: center center;
        }

        /* GENTLE ROTATION ANIMATION */

        @keyframes icon-rock {
            0%, 35%, 100% {
                transform: rotate(0deg);
            }

            42% {
                transform: rotate(-4deg);
            }

            49% {
                transform: rotate(3deg);
            }

            56% {
                transform: rotate(0deg);
            }
        }

        /* SLIGHTLY DIFFERENT TIMING FOR EACH ICON */

        .image-button:nth-child(4n + 2) img {
            animation-delay: 0.6s;
        }

        .image-button:nth-child(4n + 3) img {
            animation-delay: 1.2s;
        }

        .image-button:nth-child(4n + 4) img {
            animation-delay: 1.8s;
        }

        /* HOVER EFFECT */

        .image-button:hover img {
            opacity: 0.7;
        }

        .image-button:active img {
            opacity: 0.5;
        }

        /* MOBILE */

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .home-button {
                margin-bottom: 25px;
            }

            .page-title {
                margin: 20px 0 35px;
            }

            .button-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                column-gap: 18px;
                row-gap: 30px;
            }

            .image-button {
                padding: 5px;
            }
        }

        /* ACCESSIBILITY: REDUCE MOTION WHEN REQUESTED */

        @media (prefers-reduced-motion: reduce) {
            .image-button img {
                animation: none;
            }
        }

    </style>
</head>

<body>

    <!-- HOME LINK -->

    <a class="home-button" href="index.html">
        ╾━╤デ╦︻
    </a>

    <!-- PAGE TITLE -->

    <h1 class="page-title"></h1>

    <!-- IMAGE BUTTONS -->

    <main class="button-grid">

        <a class="image-button" href="america.html">
            <img src="images/gun_symbol.png" alt="America project">
        </a>

        <a class="image-button" href="zine_1.html">
            <img src="images/zine_symbol_1.png" alt="ZINE">
        </a>

        <a class="image-button" href="project_3.html">
            <img src="images/project_3_button.jpeg" alt="Project three">
        </a>

        <a class="image-button" href="project_4.html">
            <img src="images/project_4_button.jpeg" alt="Project four">
        </a>

        <!-- COPY THIS BLOCK TO ADD ANOTHER BUTTON -->

        <a class="image-button" href="project_5.html">
            <img src="images/project_5_button.jpeg" alt="Project five">
        </a>

    </main>

</body>
</html>
