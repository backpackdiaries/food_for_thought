<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>𝔭𝔯𝔬𝔧𝔢𝔠𝔱𝔰</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="images/icon.png">

    <style>
        /* GLOBAL */

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background-color: #02010f;
        }

        body {
            font-family: monospace;
            font-size: 14px;
            color: fuchsia;
            background-color: #02010f;

            margin: 0;
            padding: 15px;

            min-height: 100vh;
            min-height: 100dvh;

            overflow-x: hidden;
        }

        /* LINKS */

        a {
            color: rgb(105, 255, 150);
            text-decoration: none;
        }

        a:hover,
        a:active {
            color: fuchsia;
        }

        /* HOME BUTTON */

        .home-button {
            display: inline-block;
            margin-bottom: 35px;
        }

        /* PAGE TITLE */

        .page-title {
            text-align: center;
            font-size: 13px;
            font-weight: normal;
            margin: 20px 0 50px;
        }

        /* IMAGE BUTTON GRID */

        .button-grid {
            display: grid;

            /* FOUR COLUMNS ON DESKTOP */
            grid-template-columns: repeat(4, minmax(0, 1fr));

            column-gap: 25px;
            row-gap: 45px;

            width: 100%;
            max-width: 1200px;

            margin: 0 auto;
        }

        /* INDIVIDUAL IMAGE BUTTON */

        .image-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            padding: 8px;
        }

        .image-button img {
            display: block;

            width: 100%;
            height: auto;

            object-fit: contain;
            transform-origin: center center;

            /* CHOPPY, STOP-START ROTATION */
            animation: icon-rock 2.4s steps(1, end) infinite;
        }

        /* ROTATION ANIMATION */

        @keyframes icon-rock {
            0%, 70%, 100% {
                transform: rotate(0deg);
            }

            75% {
                transform: rotate(-3deg);
            }

            80% {
                transform: rotate(-6deg);
            }

            85% {
                transform: rotate(3deg);
            }

            90% {
                transform: rotate(0deg);
            }
        }

        /* STAGGER THE ICONS */

        .image-button:nth-child(4n + 2) img {
            animation-delay: 0.4s;
        }

        .image-button:nth-child(4n + 3) img {
            animation-delay: 0.9s;
        }

        .image-button:nth-child(4n + 4) img {
            animation-delay: 1.4s;
        }

        /* HOVER EFFECTS */

        .image-button:hover img {
            opacity: 0.7;
        }

        .image-button:active img {
            opacity: 0.5;
        }

        /* MOBILE */

        @media (max-width: 768px) {

            body {
                padding: 10px;
            }

            .home-button {
                margin-bottom: 25px;
            }

            .page-title {
                margin: 20px 0 35px;
            }

            .button-grid {
                /* TWO COLUMNS ON MOBILE */
                grid-template-columns: repeat(2, minmax(0, 1fr));

                column-gap: 18px;
                row-gap: 30px;
            }

            .image-button {
                padding: 5px;
            }
        }

    </style>
</head>

<body>

    <!-- HOME LINK -->

    <a class="home-button" href="food_for_thought.html">
        ╾━╤デ╦︻
    </a>

    <!-- PAGE TITLE -->

    <h1 class="page-title"></h1>

    <!-- IMAGE BUTTONS -->

    <main class="button-grid">

        <!-- BUTTON 1 -->

        <a class="image-button" href="america.html">
            <img src="images/gun_symbol.png" alt="America">
        </a>

        <!-- BUTTON 2 -->

        <a class="image-button" href="zine_1.html">
            <img src="images/zine_symbol_1.png" alt="ZINE">
        </a>

        <!-- BUTTON 3 -->

        <a class="image-button" href="kae_zine.html">
            <img src="images/kae_symbol_1.png" alt="KAE">
        </a>

        <!-- BUTTON 4 -->

        <a class="image-button" href="daisy_doom.html">
            <img src="images/daisy_doom_type_sketch.jpg" alt="Daisy Doom">
        </a>

        <!-- COPY THIS BLOCK TO ADD ANOTHER BUTTON -->

        <a class="image-button" href="sudoku.html">
            <img src="images/open_design_mom.jpeg" alt="Sudoku Game">
        </a>

    </main>

</body>
</html>
