<!DOCTYPE html>
<html>
<head>
    <title>𝓹𝓵𝓪𝓷𝓮</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="images/icon.png">

    <style>

        body {
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            color: black;
            background-color: #3fa9ed;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
            text-align: center;
        }

        a {
            color: rgb(105, 255, 150);
            text-decoration: none;
        }


        /* CENTERED IMAGE + CAPTION */

        .composition {
            min-height: calc(100vh - 90px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }


        /* IMAGE */

        .image-stack {
            width: 40%;
            max-width: 500px;
            margin: 0 auto;
            line-height: 0;
        }

        .image-stack img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            padding: 0;
        }


        /* CAPTION */

        .caption {
            margin-top: 20px;
            text-align: center;
        }


        /* PHONE */

        @media (max-width: 768px) {

            .composition {
                min-height: calc(100vh - 70px);
            }

            .image-stack {
                width: 80%;
                max-width: none;
                margin-left: auto;
                margin-right: auto;
            }

            .image-stack img {
                width: 100%;
            }

            .caption {
                font-size: 14px;
            }

        }

    </style>
</head>

<body>
    <br>
    <br>
    

    <a href="food_for_thought.html">╾━╤デ╦︻</a>

    <div class="composition">

        <div class="image-stack">

            <img src="images/img20260714_13322899.jpg">

        </div>

        <div class="caption">
            3" x 2" ✎ᝰ. acrylic paint
        </div>

    </div>

</body>
</html>
