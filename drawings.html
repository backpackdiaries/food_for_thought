body {
    font-family: monospace;
    color: fuchsia;
    background-color: #02010f;

    margin: 0;
}


/* LINKS */

a {
    color: rgb(105, 255, 150);
    text-decoration: none;

a:hover {

a:active {

/* BACK BUTTON */

.home-button {
    display: inline-block;
    font-size: 14px;
    margin-bottom: 30px;
}



/* DRAWING GRID */

.gallery {
    column-count: 3;
    column-gap: 10px;
}


/* DRAWING LINKS */

.gallery a {
    display: block;
    position: relative;
    margin-bottom: 10px;
    break-inside: avoid;
    border-radius: 5px;
    overflow: hidden;
}


/* DRAWINGS */

.gallery img {
    display: block;
    width: 100%;
    height: auto;
    filter: grayscale(100%);
}


/* FUSHIA MONOCHROME EFFECT */

.gallery a::after {
    content: "";
    position: absolute;
    inset: 0;
    background: fuchsia;
    mix-blend-mode: multiply;
    opacity: 0.85;
    pointer-events: none;
}


/* HOVER */

.gallery a:hover::after {
    opacity: 0;
}


/* PHONE */

@media (max-width: 768px) {

    .gallery {
        column-count: 2;
        column-gap: 6px;
    }

    .gallery a {
        margin-bottom: 6px;
    }

}
