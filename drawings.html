<!DOCTYPE html>
<html>

<head>

    <title>drawings</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="images/icon.png">

</head>



<style>

body {
    font-family: monospace;
    color: fuchsia;
    background-color: #02010f;
    font-size: 14px;
    padding: 15px;
    margin: 0;
}


/* LINKS */

a {
    color: rgb(105, 255, 150);
    text-decoration: none;
}

a:hover {
    color: fuchsia;
}

a:active {
    color: fuchsia;
}


/* BACK BUTTON */

.home-button {
    display: inline-block;
    font-size: 14px;
    margin-bottom: 30px;
}



/* DRAWING GRID */

.gallery {
    column-count: 3;
    column-gap: 10px;
}


/* DRAWING LINKS */

.gallery a {
    display: block;
    position: relative;
    margin-bottom: 10px;
    break-inside: avoid;
    border-radius: 5px;
    overflow: hidden;
}


/* DRAWINGS */

.gallery img {
    display: block;
    width: 100%;
    height: auto;
    filter: grayscale(100%);
}


/* FUSHIA MONOCHROME EFFECT */

.gallery a::after {
    content: "";
    position: absolute;
    inset: 0;
    background: fuchsia;
    mix-blend-mode: multiply;
    opacity: 0.85;
    pointer-events: none;
}


/* HOVER */

.gallery a:hover::after {
    opacity: 0;
}


/* PHONE */

@media (max-width: 768px) {

    .gallery {
        column-count: 2;
        column-gap: 6px;
    }

    .gallery a {
        margin-bottom: 6px;
    }

}



</style>



<body>


<a class="home-button" href="index.html">╾━╤デ╦︻</a>


<div class="gallery">


    <!-- DRAWING 1 -->

    <a href="drawing_1.html">
        <img src="images/heart_2.jpg" alt="drawing 1">
    </a>


    <!-- DRAWING 2 -->

    <a href="drawing_2.html">
        <img src="images/img20260714_13310995.jpg" alt="drawing 2">
    </a>


    <!-- DRAWING 3 -->

    <a href="drawing_3.html">
        <img src="images/img20260714_13292072.jpg" alt="drawing 3">
    </a>


    <!-- DRAWING 4 -->

    <a href="drawing_4.html">
        <img src="images/img20260713_22122832_1.jpg" alt="drawing 4">
    </a>


    <!-- DRAWING 5 -->

    <a href="drawing_5.html">
        <img src="images/img20260726_17231238.jpg" alt="drawing 5">
    </a>


</div>


</body>
</html>
