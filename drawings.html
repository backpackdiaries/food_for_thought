<!DOCTYPE html>
<html>

<head>

    <title>drawings</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="images/icon.png">

</head>


<style>

body {
    font-family: monospace;
    color: fuchsia;
    background-color: #02010f;
    font-size: 14px;
    padding: 15px;
    margin: 0;
}


/* LINKS */

a {
    color: rgb(105, 255, 150);
    text-decoration: none;
}

a:hover {
    color: fuchsia;
}

a:active {
    color: fuchsia;
}


/* BACK BUTTON */

.home-button {
    display: inline-block;
    font-size: 14px;
    margin-bottom: 30px;
}


/* DRAWING GRID */

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
    align-items: start;
}


/* DRAWING LINKS */

.gallery a {
    display: block;
}


/* DRAWINGS */

.gallery img {
    display: block;
    width: 100%;
    height: auto;
}


/* PHONE */

@media (max-width: 768px) {

    body {
        padding: 10px;
    }

    .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
    }

}


/* SMALL PHONES */

@media (max-width: 400px) {

    .gallery {
        grid-template-columns: 1fr;
    }

}

</style>


<body>


<a class="home-button" href="index.html">╾━╤デ╦︻</a>


<div class="gallery">


    <!-- DRAWING 1 -->

    </a>


    <!-- DRAWING 2 -->

    </a>


    <!-- DRAWING 3 -->

    </a>


    <!-- DRAWING 4 -->

    <a href="drawing_4.html">
        <img src="images/img20260713_22122832_1.jpg" alt="drawing 4">
    </a>


    <!-- DRAWING 5 -->

    <a href="drawing_5.html">
        <img src="images/img20260726_17231238.jpg" alt="drawing 5">
    </a>


</div>


</body>
</html>
