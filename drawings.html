<!DOCTYPE html>
<html>
<head>
    <title>drawings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="images/icon.png">
</head>

<style>

body {
    font-family: monospace;
    color: fuchsia;
    background-color: #02010f;
    font-size: 14px;
    padding: 15px;
    margin: 0;
}

a {
    color: rgb(105, 255, 150);
    text-decoration: none;
}

a:active {
    color: fuchsia;
}


/* BACK BUTTON */

.home-button {
    display: inline-block;
    font-size: 14px;
    margin-bottom: 25px;
}


/* IMAGE GALLERY */

.gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: flex-start;
}


/* IMAGE LINKS */

.gallery a {
    display: block;
    flex-grow: 1;
}


/* IMAGES */

.gallery img {
    display: block;
    width: 100%;
    height: 180px;
    object-fit: cover;
}


/* LAST ROW */

.gallery::after {
    content: "";
    flex-grow: 10;
}


/* PHONE */

@media (max-width: 768px) {

    body {
        padding: 10px;
    }

    .gallery {
        gap: 4px;
    }

    .gallery img {
        height: 120px;
    }

}

</style>


<body>

    <a class="home-button" href="index.html">╾━╤デ╦︻</a>


    <div class="gallery">

        <a href="images/drawing_1.jpg">
            <img src="images/drawing_1.jpg" alt="drawing">
        </a>

        <a href="images/drawing_2.jpg">
            <img src="images/drawing_2.jpg" alt="drawing">
        </a>

        <a href="images/drawing_3.jpg">
            <img src="images/drawing_3.jpg" alt="drawing">
        </a>

        <a href="images/drawing_4.jpg">
            <img src="images/drawing_4.jpg" alt="drawing">
        </a>

        <a href="images/drawing_5.jpg">
            <img src="images/drawing_5.jpg" alt="drawing">
        </a>

    </div>

</body>
</html>
